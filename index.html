<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breaking Nurse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --bg:#fbfbf5;
    --paper:#ffffff;
    --ink:#17190f;
    --ink-soft:#54563f;
    --ink-faint:#8b8c72;
    --line:#e3e3d3;
    --green-900:#1c2b0e;
    --green-800:#25400f;
    --green-700:#345a14;
    --green-600:#48771a;
    --green-500:#5f9424;
    --green-400:#7bb437;
    --green-100:#e9f1d9;
    --yellow-700:#a67c00;
    --yellow-600:#c99a00;
    --yellow-500:#e9b400;
    --yellow-400:#f3c93a;
    --yellow-100:#fdf1c9;
    --danger:#9c2f21;
    --danger-bg:#fbeae7;
    --shadow-sm: 0 2px 8px rgba(20,25,10,.06);
    --shadow-md: 0 12px 30px rgba(20,25,10,.10);
    --radius: 14px;
    --font-display:'Oswald', 'Cairo', sans-serif;
    --font-body:'Cairo', 'Oswald', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12140c;
      --paper:#1a1d12;
      --ink:#f2f2e8;
      --ink-soft:#c8c9b4;
      --ink-faint:#8c8e72;
      --line:#33362332;
      --line:#333624;
      --green-100:#243016;
      --yellow-100:#332b0e;
      --danger-bg:#3a1c17;
      --shadow-sm: 0 2px 10px rgba(0,0,0,.4);
      --shadow-md: 0 14px 34px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12140c;
    --paper:#1a1d12;
    --ink:#f2f2e8;
    --ink-soft:#c8c9b4;
    --ink-faint:#8c8e72;
    --line:#333624;
    --green-100:#243016;
    --yellow-100:#332b0e;
    --danger-bg:#3a1c17;
    --shadow-sm: 0 2px 10px rgba(0,0,0,.4);
    --shadow-md: 0 14px 34px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body[dir="rtl"]{ letter-spacing:0; }
  a{color:inherit;}
  button{font-family:inherit;}
  .wrap{max-width:980px;margin:0 auto;padding:0 20px;}

  /* ---------- Header ---------- */
  header.topbar{
    position:sticky; top:0; z-index:40;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:980px;margin:0 auto;padding:12px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brandblock{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .tile{
    width:38px;height:38px;border-radius:7px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--font-display);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
    position:relative;
    flex:none;
  }
  .tile .num{position:absolute;top:2px; inset-inline-start:4px; font-size:6px;font-weight:600;opacity:.7;}
  .tile .sym{font-size:16px;font-weight:700;line-height:1;}
  .tile-green{background:linear-gradient(160deg,var(--green-400),var(--green-700));color:#f4ffe0;}
  .tile-yellow{background:linear-gradient(160deg,var(--yellow-400),var(--yellow-700));color:#2a1d00;}
  .brand-word{
    font-family:var(--font-display);
    font-weight:700;
    font-size:19px;
    letter-spacing:.2px;
    color:var(--ink);
    white-space:nowrap;
  }
  .brand-word b{color:var(--green-600);}
  nav.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);padding:4px;border-radius:999px;box-shadow:var(--shadow-sm);}
  nav.tabs button{
    border:none;background:transparent;padding:8px 16px;border-radius:999px;
    font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;
    transition:background .15s, color .15s;
  }
  nav.tabs button.active{background:var(--green-600);color:#fff;}
  .lang-btn{
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;
    display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm);
  }
  .lang-btn:hover{border-color:var(--green-500);}
  .header-controls{display:flex;align-items:center;gap:10px;}

  @media (max-width:640px){
    .brand-word{font-size:15px;}
    nav.tabs button{padding:7px 10px;font-size:12px;}
    .topbar-inner{flex-wrap:wrap;}
  }

  main{padding:28px 0 80px;}

  /* ---------- Hero / Home ---------- */
  .hero{padding:26px 0 8px;}
  .hero h1{
    font-family:var(--font-display);
    font-size:clamp(28px,5vw,44px);
    line-height:1.05;
    margin:0 0 10px;
    font-weight:700;
  }
  .hero h1 .accent{color:var(--green-600);}
  .hero p.sub{color:var(--ink-soft);font-size:16px;max-width:60ch;margin:0 0 26px;}

  .cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:34px;}
  @media (max-width:700px){.cardgrid{grid-template-columns:1fr;}}

  .bigcard{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px; box-shadow:var(--shadow-sm); cursor:pointer;
    transition:transform .15s, box-shadow .15s, border-color .15s;
    position:relative; overflow:hidden;
  }
  .bigcard:hover{transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--green-500);}
  .bigcard .stripe{position:absolute; inset-inline-start:0; top:0; bottom:0; width:6px;}
  .bigcard.study .stripe{background:linear-gradient(var(--green-400),var(--green-700));}
  .bigcard.quiz .stripe{background:linear-gradient(var(--yellow-400),var(--yellow-700));}
  .bigcard h3{font-family:var(--font-display);font-size:22px;margin:2px 0 8px;}
  .bigcard p{margin:0;color:var(--ink-soft);font-size:14.5px;line-height:1.5;}
  .bigcard .go{margin-top:14px;font-weight:700;font-size:13.5px;color:var(--green-600);}

  h2.section-title{
    font-family:var(--font-display); font-size:22px; margin:0 0 16px;
    display:flex;align-items:center;gap:10px;
  }
  h2.section-title::after{content:"";flex:1;height:1px;background:var(--line);}

  .chapterlist{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:10px;}
  @media (max-width:820px){.chapterlist{grid-template-columns:1fr;}}

  .chcard{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:10px;
  }
  .chcard-top{display:flex;align-items:center;gap:10px;}
  .chcard h4{font-family:var(--font-display); font-size:17px; margin:0; line-height:1.25;}
  .chcard p{margin:0;color:var(--ink-soft);font-size:13.5px;line-height:1.5;flex:1;}
  .chcard .meta{font-size:12px;color:var(--ink-faint);font-weight:600;}
  .btn{
    border:none; border-radius:10px; padding:10px 16px; font-weight:700; font-size:13.5px;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    transition:filter .15s, transform .1s;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--green-600); color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-outline{background:transparent;color:var(--ink); border:1.5px solid var(--line);}
  .btn-outline:hover{border-color:var(--green-500); color:var(--green-600);}
  .btn-yellow{background:var(--yellow-500); color:#2a1d00;}
  .btn-yellow:hover{filter:brightness(1.05);}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}

  /* ---------- Study Reader ---------- */
  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-weight:600;font-size:13.5px;cursor:pointer;margin-bottom:14px;background:none;border:none;padding:0;}
  .backlink:hover{color:var(--green-600);}
  .reader-head{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .reader-head h1{font-family:var(--font-display);font-size:clamp(24px,4vw,34px);margin:0;}
  .reader-blurb{color:var(--ink-soft);margin:6px 0 26px;font-size:15px;}

  .accordion{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:22px;background:var(--paper);}
  .acc-item + .acc-item{border-top:1px solid var(--line);}
  .acc-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:15px 18px; cursor:pointer; font-weight:700; font-size:15px;
  }
  .acc-head:hover{background:var(--green-100);}
  .acc-head .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:6px;background:var(--green-600);color:#fff;
    font-family:var(--font-display); font-size:12px; flex:none;
  }
  .acc-head-left{display:flex;align-items:center;gap:10px;}
  .acc-chevron{transition:transform .2s; color:var(--ink-faint); flex:none;}
  .acc-item.open .acc-chevron{transform:rotate(90deg);}
  [dir="rtl"] .acc-item.open .acc-chevron{transform:rotate(-90deg);}
  .acc-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .acc-item.open .acc-body{max-height:2000px;}
  .acc-body-inner{padding:2px 20px 18px 52px;}
  [dir="rtl"] .acc-body-inner{padding:2px 52px 18px 20px;}
  .acc-body-inner ul{margin:0;padding:0; list-style:none; display:flex; flex-direction:column; gap:9px;}
  .acc-body-inner li{
    position:relative; padding-inline-start:18px; font-size:14.5px; line-height:1.55; color:var(--ink);
  }
  .acc-body-inner li::before{
    content:""; position:absolute; inset-inline-start:0; top:8px; width:7px;height:7px;border-radius:2px;
    background:var(--yellow-500); transform:rotate(45deg);
  }

  .reader-actions{display:flex; gap:12px; flex-wrap:wrap; margin-top:8px;}

  /* ---------- Quiz list ---------- */
  .quizcard{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; box-shadow:var(--shadow-sm); display:flex; align-items:center; gap:16px; margin-bottom:14px;
  }
  .quizcard.final{border-color:var(--yellow-500); background:linear-gradient(180deg, var(--yellow-100), var(--paper) 70%);}
  .quizcard .qinfo{flex:1;}
  .quizcard h4{font-family:var(--font-display); font-size:18px; margin:0 0 4px;}
  .quizcard p{margin:0 0 6px; color:var(--ink-soft); font-size:13.5px;}
  .quizcard .qtags{display:flex; gap:8px; flex-wrap:wrap;}
  .pill{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--green-100); color:var(--green-700);}
  .pill.yellow{background:var(--yellow-100); color:var(--yellow-700);}
  @media (max-width:600px){.quizcard{flex-direction:column; align-items:stretch;}}

  /* ---------- Quiz active ---------- */
  .quiz-top{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px;}
  .progressbar{flex:1; height:8px; border-radius:999px; background:var(--line); overflow:hidden;}
  .progressbar > div{height:100%; background:linear-gradient(90deg, var(--green-500), var(--green-700)); transition:width .3s;}
  .qcounter{font-weight:700; font-size:13.5px; color:var(--ink-soft); white-space:nowrap;}
  .scoretag{font-weight:700; font-size:13.5px; color:var(--green-700); white-space:nowrap;}

  .qcard{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px; box-shadow:var(--shadow-md);
  }
  .qcard .chaptag{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--green-600); margin-bottom:10px; display:block;}
  [dir="rtl"] .qcard .chaptag{text-transform:none;}
  .qcard h3{font-family:var(--font-display); font-size:clamp(18px,3vw,23px); margin:0 0 22px; line-height:1.4; font-weight:600;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    text-align:start; border:1.5px solid var(--line); border-radius:11px; padding:13px 16px;
    background:var(--paper); font-size:14.5px; cursor:pointer; display:flex; gap:10px; align-items:flex-start;
    color:var(--ink); transition:border-color .15s, background .15s;
  }
  .opt:hover:not(.locked){border-color:var(--green-500); background:var(--green-100);}
  .opt .optletter{
    flex:none; width:24px; height:24px; border-radius:7px; background:var(--line); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; font-family:var(--font-display);
  }
  .opt.correct{border-color:var(--green-600); background:var(--green-100);}
  .opt.correct .optletter{background:var(--green-600); color:#fff;}
  .opt.wrong{border-color:var(--danger); background:var(--danger-bg);}
  .opt.wrong .optletter{background:var(--danger); color:#fff;}
  .opt.locked{cursor:default;}

  .feedback{margin-top:18px; padding:14px 16px; border-radius:11px; font-size:14px; line-height:1.55;}
  .feedback.good{background:var(--green-100); color:var(--green-800); border:1px solid var(--green-500);}
  .feedback.bad{background:var(--danger-bg); color:var(--danger); border:1px solid var(--danger);}
  .feedback b{display:block; margin-bottom:4px; font-size:14.5px;}

  .quiz-footer{display:flex; justify-content:flex-end; margin-top:20px;}

  /* ---------- Results ---------- */
  .result-wrap{text-align:center; padding:10px 0 20px;}
  .flask{width:150px;height:190px;margin:0 auto 14px;position:relative;}
  .flask svg{width:100%;height:100%;display:block;}
  .flask .pct{
    position:absolute; left:0; right:0; bottom:34px; text-align:center;
    font-family:var(--font-display); font-weight:700; font-size:26px; color:#123006;
  }
  .result-grade{font-family:var(--font-display); font-size:22px; margin:6px 0 4px;}
  .result-sub{color:var(--ink-soft); font-size:14.5px; margin-bottom:26px;}
  .result-stats{display:flex; justify-content:center; gap:28px; margin-bottom:30px; flex-wrap:wrap;}
  .result-stat b{display:block; font-family:var(--font-display); font-size:24px;}
  .result-stat span{font-size:12.5px; color:var(--ink-faint); font-weight:600;}

  .breakdown{max-width:520px;margin:0 auto 30px; text-align:start;}
  .breakdown h4{font-family:var(--font-display); font-size:15px; margin:0 0 12px; text-align:center;}
  .bd-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13.5px;}
  .bd-row .bd-label{flex:0 0 150px; font-weight:600; color:var(--ink-soft);}
  .bd-row .bd-track{flex:1; height:9px; border-radius:999px; background:var(--line); overflow:hidden;}
  .bd-row .bd-track > div{height:100%; background:var(--green-500);}
  .bd-row .bd-pct{flex:0 0 42px; text-align:end; font-weight:700; color:var(--ink-soft);}

  .result-actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}

  footer.appfoot{text-align:center; color:var(--ink-faint); font-size:12.5px; padding:26px 20px 10px;}

  .hidden{display:none !important;}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }
</style>
</head>
<body dir="ltr">
<div id="app"></div>

<script>
/* ============================= DATA ============================= */
const DATA = {
  chapters: [
    {
      id: "fractures",
      tile: {sym:"Fx", num:"206", theme:"green"},
      title: {en:"Fractures", ar:"الكسور"},
      blurb: {
        en:"Causes and types of fractures, clinical signs, emergency care, reduction, fixation, and nursing management.",
        ar:"أسباب الكسور وأنواعها، العلامات السريرية، الإسعاف الأولي، الرّد والتثبيت، والرعاية التمريضية."
      },
      sections: [
        {
          title:{en:"Definition & Causes", ar:"التعريف والأسباب"},
          points:[
            {en:"A fracture is a break in the continuity of bone.", ar:"الكسر هو انقطاع في استمرارية العظم."},
            {en:"Common causes: a direct blow, a crushing force, a sudden twisting motion, or extreme muscle contraction.", ar:"أشهر الأسباب: ضربة مباشرة، قوة سحق، حركة التواء مفاجئة، أو انقباض عضلي شديد."}
          ]
        },
        {
          title:{en:"Types by Completeness & Skin Involvement", ar:"الأنواع حسب الاكتمال وسلامة الجلد"},
          points:[
            {en:"Complete fracture: breaks across the entire cross-section of the bone; frequently displaced.", ar:"الكسر الكامل: يمتد عبر كامل مقطع العظم، وغالبًا ما يكون مُزاحًا عن موضعه الطبيعي."},
            {en:"Incomplete fracture (e.g., greenstick): the break occurs through only part of the bone's cross-section.", ar:"الكسر غير الكامل (مثل الكسر الأخضر): يحدث خلال جزء فقط من مقطع العظم."},
            {en:"Comminuted fracture: the bone shatters into several fragments.", ar:"الكسر المفتت: يتحطم العظم إلى عدة شظايا."},
            {en:"Closed (simple) fracture: does not break the skin.", ar:"الكسر المغلق (البسيط): لا يسبب تمزقًا في الجلد."},
            {en:"Open (compound/complex) fracture: the skin or mucous membrane wound extends down to the fractured bone.", ar:"الكسر المفتوح (المركّب): يمتد فيه جرح الجلد أو الغشاء المخاطي إلى العظم المكسور."}
          ]
        },
        {
          title:{en:"Patterns Seen on X-ray", ar:"الأنماط الظاهرة بالأشعة"},
          points:[
            {en:"Named patterns include: avulsion, displaced, greenstick, impacted, interarticular, longitudinal, oblique, pathologic, spiral, stress, and transverse fractures.", ar:"من الأنماط الشائعة: القلعي، المُزاح، الأخضر، المنطبع، داخل المفصل، الطولي، المائل، المرضي، الحلزوني، كسر الإجهاد، والعرضي."}
          ]
        },
        {
          title:{en:"Clinical Manifestations", ar:"المظاهر السريرية"},
          points:[
            {en:"Pain and tenderness at the injury site, from muscle spasm, tissue trauma, and nerve pressure.", ar:"ألم وحساسية عند موضع الإصابة، بسبب تشنج العضلات وإصابة الأنسجة والضغط على الأعصاب."},
            {en:"Swelling from soft-tissue disruption or bleeding into surrounding tissue.", ar:"تورم ناتج عن اضطراب الأنسجة الرخوة أو النزف داخلها."},
            {en:"False motion and crepitus: a grating/crushing sensation as bone fragments rub together.", ar:"حركة زائفة وفرقعة عظمية: إحساس بالاحتكاك عند تحرك شظايا العظم."},
            {en:"Visible deformity and loss of function of the affected part.", ar:"تشوّه ظاهر وفقدان وظيفة الجزء المصاب."},
            {en:"Ecchymosis: skin discoloration from blood leaking into subcutaneous tissue.", ar:"إكيموزيس: تغيّر لون الجلد نتيجة تسرب الدم إلى الأنسجة تحت الجلدية."},
            {en:"Paresthesia: a burning or tingling sensation.", ar:"تنمّل: إحساس بالحرقان أو الوخز."},
            {en:"Shock: bone is highly vascular, so hemorrhage can be overt (through an open wound) or covert (into soft tissue/body cavity) and may be fatal if missed.", ar:"الصدمة: العظم غني بالأوعية الدموية، والنزف قد يكون ظاهرًا عبر جرح مفتوح أو خفيًا داخل الأنسجة أو تجويف الجسم، وقد يكون قاتلًا إن لم يُكتشف."}
          ]
        },
        {
          title:{en:"Diagnostic Evaluation", ar:"التقييم التشخيصي"},
          points:[
            {en:"History and physical examination.", ar:"التاريخ المرضي والفحص السريري."},
            {en:"X-ray and other imaging to determine bone integrity.", ar:"الأشعة السينية ودراسات تصوير أخرى لتحديد سلامة العظم."},
            {en:"Blood studies (CBC) may show decreased hemoglobin and hematocrit with blood loss and muscle damage.", ar:"فحوصات الدم (CBC) قد تُظهر انخفاض الهيموغلوبين والهيماتوكريت مع فقد الدم وتلف العضلات."},
            {en:"Arthroscopy to detect joint involvement; angiography if a blood vessel injury is suspected; EMG to detect nerve injury.", ar:"تنظير المفصل لاكتشاف إصابة المفصل؛ تصوير الأوعية عند اشتباه إصابة وعائية؛ تخطيط العضلات الكهربائي لاكتشاف إصابة الأعصاب."}
          ]
        },
        {
          title:{en:"Complications", ar:"المضاعفات"},
          points:[
            {en:"Early: shock, fat embolism, and venous thromboembolism (VTE), which can lead to pulmonary embolism (PE).", ar:"المبكرة: الصدمة، الانصمام الدهني، والانصمام الوريدي الذي قد يؤدي إلى انسداد رئوي."},
            {en:"Delayed: delayed union, malunion, or nonunion; avascular necrosis; complex regional pain syndrome; heterotrophic ossification.", ar:"المتأخرة: تأخر أو سوء أو عدم التئام العظم؛ النخر اللاوعائي؛ متلازمة الألم الإقليمي المعقد؛ التعظم غير المنتظم."}
          ]
        },
        {
          title:{en:"Emergency Management", ar:"الإدارة الإسعافية"},
          points:[
            {en:"Immobilize the body part before the patient is moved.", ar:"تثبيت الجزء المصاب قبل نقل المريض."},
            {en:"If removed from a vehicle before splinting, support the limb above and below the fracture site to prevent rotation.", ar:"إذا تطلب الأمر إخراج المصاب من مركبة قبل التجبير، يُدعم الطرف فوق وتحت موضع الكسر لمنع الدوران."},
            {en:"Splint adequately, including the joints adjacent to the fracture, to prevent soft-tissue damage and bleeding.", ar:"استخدام جبيرة مناسبة تشمل المفاصل المجاورة للكسر لمنع تلف الأنسجة الرخوة والنزف."},
            {en:"Assess neurovascular status distal to the injury.", ar:"تقييم الحالة العصبية الوعائية أسفل موضع الإصابة."},
            {en:"For an open fracture, cover the wound with a clean sterile dressing to prevent contamination.", ar:"في الكسر المفتوح، تُغطى الإصابة بضمادة معقمة نظيفة لمنع التلوث."},
            {en:"Never attempt to reduce the fracture in the field, even if a bone fragment protrudes through the wound.", ar:"لا تُبذل أي محاولة لرد الكسر في الميدان، حتى لو برزت إحدى شظايا العظم عبر الجرح."},
            {en:"The patient is evaluated completely in the emergency department; clothing is cut away, and the injured limb is moved as little as possible.", ar:"يُقيَّم المريض تقييمًا كاملًا في قسم الطوارئ؛ تُقص الملابس، ويُحرَّك الطرف المصاب بأقل قدر ممكن."}
          ]
        },
        {
          title:{en:"Medical Management: Reduction", ar:"الإدارة الطبية: رد الكسر"},
          points:[
            {en:"Reduction (\"setting\" the bone) restores fracture fragments to normal anatomical position and alignment.", ar:"رد الكسر (\"تثبيت\" العظم) يعيد شظايا الكسر إلى وضعها التشريحي الطبيعي."},
            {en:"Purposes: regain function, prevent/delay degenerative joint changes, and minimize deforming effect of the injury.", ar:"الأهداف: استعادة الوظيفة، منع أو تأخير التغيرات التنكسية بالمفصل، وتقليل التشوّه الناتج عن الإصابة."},
            {en:"Closed reduction: non-surgical manual realignment, usually under x-ray guidance, with local or general anesthesia — used for closed fractures.", ar:"الرد المغلق: إعادة محاذاة يدوية غير جراحية، غالبًا تحت توجيه الأشعة، بتخدير موضعي أو عام — يُستخدم للكسور المغلقة."},
            {en:"Open reduction: a surgical procedure correcting alignment through an incision under direct visualization, under general anesthesia — used when closed reduction fails or the fracture is complicated.", ar:"الرد المفتوح: إجراء جراحي يُصحَّح فيه المحاذاة عبر شق جراحي تحت الرؤية المباشرة، بتخدير عام — يُستخدم عند فشل الرد المغلق أو تعقّد الكسر."}
          ]
        },
        {
          title:{en:"Internal Fixation & ORIF", ar:"التثبيت الداخلي وORIF"},
          points:[
            {en:"Internal fixation devices — metallic pins, wires, screws, plates, nails, or rods — hold bone fragments in position until solid healing occurs.", ar:"أجهزة التثبيت الداخلي — دبابيس أو أسلاك أو براغي أو صفائح أو مسامير أو قضبان معدنية — تُثبّت شظايا العظم في مكانها حتى يحدث الشفاء الصلب."},
            {en:"Open Reduction and Internal Fixation (ORIF) combines surgical realignment with internal hardware fixation.", ar:"رد الكسر المفتوح والتثبيت الداخلي (ORIF) يجمع بين إعادة المحاذاة الجراحية والتثبيت بالأجهزة الداخلية."}
          ]
        },
        {
          title:{en:"Immobilization Methods", ar:"طرق التثبيت"},
          points:[
            {en:"External fixation: bandages, casts, splints, continuous traction, or external fixator frames.", ar:"التثبيت الخارجي: الضمادات، الجبس، الجبائر، الشد المستمر، أو أطر التثبيت الخارجي."},
            {en:"Internal fixation: metal implants act as internal splints to immobilize the fracture.", ar:"التثبيت الداخلي: تعمل الزرعات المعدنية كجبائر داخلية لتثبيت الكسر."}
          ]
        },
        {
          title:{en:"Maintaining & Restoring Function", ar:"الحفاظ على الوظيفة واستعادتها"},
          points:[
            {en:"Control swelling by elevating the limb and applying ice.", ar:"التحكم في التورم برفع الطرف ووضع الثلج."},
            {en:"Monitor neurovascular status (circulation, movement, sensation); notify the surgeon immediately if compromise is suspected.", ar:"مراقبة الحالة العصبية الوعائية (الدورة الدموية، الحركة، الإحساس)؛ وإبلاغ الجرّاح فورًا عند الاشتباه بقصور."},
            {en:"Use position changes and analgesics to control anxiety and discomfort.", ar:"استخدام تغييرات الوضعية والمسكنات للسيطرة على القلق والانزعاج."},
            {en:"Encourage isometric and muscle-setting exercises to minimize disuse atrophy and promote circulation.", ar:"تشجيع تمارين إيزومترية وتمارين تثبيت العضلات لتقليل الضمور الناتج عن عدم الاستعمال وتعزيز الدورة الدموية."},
            {en:"Encourage a gradual, progressive resumption of daily activity.", ar:"تشجيع الاستئناف التدريجي للأنشطة اليومية."}
          ]
        },
        {
          title:{en:"Nursing Management — Closed Fractures", ar:"إدارة التمريض — الكسور المغلقة"},
          points:[
            {en:"Encourage return to usual activities as rapidly as possible.", ar:"تشجيع العودة إلى الأنشطة المعتادة بأسرع وقت ممكن."},
            {en:"Teach how to control swelling and pain, and to stay active within limits of immobilization.", ar:"تعليم كيفية التحكم بالتورم والألم، والبقاء نشطًا ضمن حدود التثبيت."},
            {en:"Teach exercises for unaffected muscles and how to use assistive devices (crutches, walker).", ar:"تعليم تمارين للعضلات غير المصابة وكيفية استخدام الأجهزة المساعدة (العكازات، المشاية)."},
            {en:"Help modify the home environment and arrange personal assistance if needed.", ar:"المساعدة على تعديل البيئة المنزلية وترتيب مساعدة شخصية عند الحاجة."}
          ]
        },
        {
          title:{en:"Nursing Management — Open Fractures", ar:"إدارة التمريض — الكسور المفتوحة"},
          points:[
            {en:"Open fractures carry risk of osteomyelitis, tetanus, and gas gangrene; tetanus prophylaxis is given.", ar:"الكسور المفتوحة تحمل خطر التهاب العظم والنقي، الكزاز، والغرغرينا الغازية؛ وتُعطى الوقاية من الكزاز."},
            {en:"Serial irrigation and debridement remove anaerobic organisms; IV antibiotics prevent or treat infection.", ar:"الري والتنضير المتكرر يزيلان الكائنات اللاهوائية؛ وتُعطى المضادات الحيوية الوريدية للوقاية من العدوى أو علاجها."},
            {en:"The wound is cultured; devitalized bone fragments are removed.", ar:"يُؤخذ مزرعة من الجرح؛ وتُزال شظايا العظم غير الحيوية."},
            {en:"The fracture is carefully reduced and stabilized with external fixation or intramedullary nails; damaged vessels, muscles, nerves, and tendons are repaired.", ar:"يُرَد الكسر بعناية ويُثبَّت بالتثبيت الخارجي أو المسامير داخل النخاع؛ وتُصلَح الأوعية والعضلات والأعصاب والأوتار المتضررة."},
            {en:"Primary wound closure is delayed; heavily contaminated wounds are left open and dressed with sterile gauze.", ar:"يتأخر إغلاق الجرح الأولي؛ وتُترَك الجروح شديدة التلوث دون خياطة وتُغطى بشاش معقم."},
            {en:"Elevate the extremity to minimize edema; assess neurovascular status frequently and monitor temperature for signs of infection.", ar:"رفع الطرف لتقليل الوذمة؛ وتقييم الحالة العصبية الوعائية بشكل متكرر ومراقبة الحرارة لاكتشاف علامات العدوى."},
            {en:"Bone grafting may be needed at 4–8 weeks to bridge a bone defect and stimulate healing.", ar:"قد تُحتاج زراعة العظم خلال 4 إلى 8 أسابيع لسدّ فجوة عظمية وتحفيز الشفاء."}
          ]
        },
        {
          title:{en:"Rehabilitation", ar:"التأهيل"},
          points:[
            {en:"Rehabilitation means regaining the highest physical function of the affected part after injury; it should start on day one of hospitalization and continue after discharge.", ar:"التأهيل هو استعادة أعلى وظيفة جسدية ممكنة للجزء المصاب بعد الإصابة؛ ويجب أن يبدأ من أول يوم في المستشفى ويستمر بعد الخروج."},
            {en:"Goals: move the patient from dependence to independence in daily activities, help adjust to problems caused by the injury, and prevent related complications.", ar:"الأهداف: الانتقال من الاعتماد على الغير إلى الاستقلالية في الأنشطة اليومية، مساعدة المريض على التكيف مع مشاكل الإصابة، ومنع المضاعفات المرتبطة بها."},
            {en:"Nurse's role: know physical-therapy goals, encourage ROM and isometric exercises, teach assistive-device use, listen to concerns, and prepare the patient for discharge and follow-up.", ar:"دور الممرضة: معرفة أهداف العلاج الطبيعي، تشجيع تمارين مدى الحركة والتمارين الإيزومترية، تعليم استخدام الأجهزة المساعدة، الإصغاء لمخاوف المريض، وتجهيزه للخروج والمتابعة."}
          ]
        },
        {
          title:{en:"Hip Fracture — Nursing Process", ar:"كسر الورك — عملية التمريض"},
          points:[
            {en:"Assessment: pain, vital signs and shock signs, neurovascular status of the limb, bowel/bladder pattern, skin condition, and anxiety/coping.", ar:"التقييم: الألم، العلامات الحيوية وعلامات الصدمة، الحالة العصبية الوعائية للطرف، نمط الإخراج، حالة الجلد، والقلق والتكيف."},
            {en:"Potential complications: hemorrhage, peripheral neurovascular dysfunction, deep vein thrombosis, pulmonary complications, and pressure ulcers.", ar:"المضاعفات المحتملة: النزف، الخلل العصبي الوعائي الطرفي، تخثر الأوردة العميقة، مضاعفات رئوية، وتقرحات الضغط."},
            {en:"Pain relief: prescribed analgesics, Buck's traction as ordered, gentle handling, and comfortable positioning.", ar:"تخفيف الألم: المسكنات الموصوفة، شد باك حسب الطلب، التعامل بلطف، والتموضع المريح."},
            {en:"Mobility: maintain neutral hip position, use trochanter rolls, keep hip abduction, isometric/quad-setting/gluteal exercises, use of the trapeze, and ambulatory aids.", ar:"الحركة: الحفاظ على وضعية محايدة للورك، استخدام لفة التروكانتر، الحفاظ على تباعد الورك، تمارين إيزومترية وتمارين الفخذ والأرداف، استخدام الأرجوحة، والأجهزة المساعدة على الحركة."},
            {en:"Safety: aseptic dressing changes, encourage coughing/deep breathing and hydration, apply TED hose or sequential compression devices, and encourage ankle exercises.", ar:"السلامة: تغيير الضمادات بتقنية معقمة، تشجيع السعال والتنفس العميق والترطيب الكافي، استخدام جوارب مضادة للتخثر أو أجهزة الضغط المتسلسل، وتشجيع تمارين الكاحل."}
          ]
        }
      ],
      questions: [
        {q:{en:"A fracture is best defined as:", ar:"يُعرَّف الكسر بأنه:"},
         options:[
           {en:"A break in the continuity of bone", ar:"انقطاع في استمرارية العظم"},
           {en:"A tear in a ligament surrounding a joint", ar:"تمزق في رباط محيط بالمفصل"},
           {en:"Inflammation of the synovial membrane", ar:"التهاب الغشاء الزليلي"},
           {en:"Softening of bone from inadequate mineralization", ar:"تليّن العظم بسبب نقص التمعدن"}
         ], correct:0,
         exp:{en:"A fracture is simply a break in the continuity of bone, caused by trauma exceeding the bone's tolerance.", ar:"الكسر هو ببساطة انقطاع في استمرارية العظم، ناتج عن قوة تتجاوز تحمل العظم."}},

        {q:{en:"Which of these is NOT a typical cause of a fracture?", ar:"أيّ مما يلي ليس سببًا نموذجيًا للكسر؟"},
         options:[
           {en:"A direct blow", ar:"ضربة مباشرة"},
           {en:"A crushing force", ar:"قوة سحق"},
           {en:"A viral infection", ar:"عدوى فيروسية"},
           {en:"A sudden twisting motion", ar:"حركة التواء مفاجئة"}
         ], correct:2,
         exp:{en:"Typical causes are direct blows, crushing forces, sudden twisting, and extreme muscle contraction — not infection.", ar:"الأسباب النموذجية هي الضربة المباشرة، قوة السحق، الالتواء المفاجئ، والانقباض العضلي الشديد — وليست العدوى."}},

        {q:{en:"A fracture in which the break passes through only part of the bone's cross-section (common in children) is called:", ar:"الكسر الذي يمر خلال جزء فقط من مقطع العظم (شائع عند الأطفال) يُسمى:"},
         options:[
           {en:"Comminuted fracture", ar:"كسر مفتت"},
           {en:"Greenstick (incomplete) fracture", ar:"كسر أخضر (غير كامل)"},
           {en:"Complete fracture", ar:"كسر كامل"},
           {en:"Impacted fracture", ar:"كسر منطبع"}
         ], correct:1,
         exp:{en:"An incomplete fracture, such as a greenstick fracture, involves only part of the bone's cross-section.", ar:"الكسر غير الكامل، مثل الكسر الأخضر، يشمل جزءًا فقط من مقطع العظم."}},

        {q:{en:"A fracture with several bone fragments is termed:", ar:"الكسر الذي ينتج عنه عدة شظايا عظمية يُسمى:"},
         options:[
           {en:"Comminuted fracture", ar:"كسر مفتت"},
           {en:"Greenstick fracture", ar:"كسر أخضر"},
           {en:"Closed fracture", ar:"كسر مغلق"},
           {en:"Stress fracture", ar:"كسر إجهاد"}
         ], correct:0,
         exp:{en:"A comminuted fracture shatters the bone into several fragments.", ar:"الكسر المفتت يحطم العظم إلى عدة شظايا."}},

        {q:{en:"A fracture in which the overlying skin or mucous membrane is torn open down to the bone is a(n):", ar:"الكسر الذي يمتد فيه تمزق الجلد أو الغشاء المخاطي إلى العظم يُسمى:"},
         options:[
           {en:"Closed (simple) fracture", ar:"كسر مغلق (بسيط)"},
           {en:"Pathologic fracture", ar:"كسر مرضي"},
           {en:"Open (compound) fracture", ar:"كسر مفتوح (مركّب)"},
           {en:"Stress fracture", ar:"كسر إجهاد"}
         ], correct:2,
         exp:{en:"An open (compound) fracture has a wound that extends to the fractured bone, exposing it to contamination.", ar:"الكسر المفتوح يمتد فيه الجرح إلى العظم المكسور، ما يعرضه للتلوث."}},

        {q:{en:"The grating or crushing sensation felt when bone fragments rub together is called:", ar:"الإحساس بالاحتكاك أو السحق عند تحرك شظايا العظم يُسمى:"},
         options:[
           {en:"Crepitus", ar:"الفرقعة العظمية"},
           {en:"Ecchymosis", ar:"إكيموزيس"},
           {en:"Paresthesia", ar:"تنمّل"},
           {en:"Contracture", ar:"تقلّص"}
         ], correct:0,
         exp:{en:"Crepitus is the grating/crushing sensation or sound produced by bone fragments rubbing together.", ar:"الفرقعة العظمية هي الإحساس أو الصوت الناتج عن احتكاك شظايا العظم."}},

        {q:{en:"Ecchymosis after a fracture is best described as:", ar:"الإكيموزيس بعد الكسر يُوصف بأنه:"},
         options:[
           {en:"A burning or tingling sensation", ar:"إحساس بالحرقان أو الوخز"},
           {en:"Discoloration of the skin from blood leaking into subcutaneous tissue", ar:"تغيّر لون الجلد بسبب تسرب الدم إلى الأنسجة تحت الجلدية"},
           {en:"A grating sound at the fracture site", ar:"صوت احتكاك عند موضع الكسر"},
           {en:"Complete loss of limb function", ar:"فقدان تام لوظيفة الطرف"}
         ], correct:1,
         exp:{en:"Ecchymosis is skin discoloration (bruising) caused by blood extravasating into subcutaneous tissue.", ar:"الإكيموزيس هو تغيّر لون الجلد (كدمة) بسبب تسرب الدم إلى الأنسجة تحت الجلدية."}},

        {q:{en:"Which of the following is an EARLY complication of a fracture?", ar:"أيّ مما يلي يُعد من المضاعفات المبكرة للكسر؟"},
         options:[
           {en:"Avascular necrosis", ar:"النخر اللاوعائي"},
           {en:"Fat embolism", ar:"الانصمام الدهني"},
           {en:"Nonunion", ar:"عدم التئام العظم"},
           {en:"Heterotrophic ossification", ar:"التعظم غير المنتظم"}
         ], correct:1,
         exp:{en:"Fat embolism, shock, and venous thromboembolism are early complications; the others are delayed complications.", ar:"الانصمام الدهني والصدمة والانصمام الوريدي مضاعفات مبكرة؛ أما الباقي فمضاعفات متأخرة."}},

        {q:{en:"Failure of a fractured bone to heal at all is called:", ar:"فشل العظم المكسور في الالتئام نهائيًا يُسمى:"},
         options:[
           {en:"Malunion", ar:"سوء الالتئام"},
           {en:"Delayed union", ar:"تأخر الالتئام"},
           {en:"Nonunion", ar:"عدم الالتئام"},
           {en:"Osteomyelitis", ar:"التهاب العظم والنقي"}
         ], correct:2,
         exp:{en:"Nonunion means the bone fragments fail to unite at all; malunion means they unite in a faulty position.", ar:"عدم الالتئام يعني أن شظايا العظم لم تلتحم إطلاقًا؛ أما سوء الالتئام فيعني التحامها بوضعية خاطئة."}},

        {q:{en:"Before moving a patient with a suspected fracture, the FIRST priority is to:", ar:"قبل نقل مريض يُشتبه بإصابته بكسر، الأولوية الأولى هي:"},
         options:[
           {en:"Reduce the fracture manually", ar:"رد الكسر يدويًا"},
           {en:"Immobilize the injured body part", ar:"تثبيت الجزء المصاب"},
           {en:"Remove the patient's clothing", ar:"إزالة ملابس المريض"},
           {en:"Apply moist heat to the area", ar:"تطبيق حرارة رطبة على المنطقة"}
         ], correct:1,
         exp:{en:"The injured part must be immobilized immediately after injury, before the patient is moved, to prevent further damage.", ar:"يجب تثبيت الجزء المصاب فورًا بعد الإصابة وقبل نقل المريض، لمنع مزيد من الضرر."}},

        {q:{en:"At the scene of an open fracture, the nurse should:", ar:"في موقع كسر مفتوح، يجب على الممرضة:"},
         options:[
           {en:"Attempt to push the protruding bone back under the skin", ar:"محاولة إعادة العظم البارز تحت الجلد"},
           {en:"Cover the wound with a clean, sterile dressing", ar:"تغطية الجرح بضمادة معقمة ونظيفة"},
           {en:"Irrigate the wound thoroughly with tap water", ar:"غسل الجرح جيدًا بماء الصنبور"},
           {en:"Apply firm traction to straighten the limb", ar:"تطبيق شد قوي لتقويم الطرف"}
         ], correct:1,
         exp:{en:"The open wound is covered with a clean sterile dressing; reduction is never attempted in the field, even if bone protrudes.", ar:"يُغطى الجرح المفتوح بضمادة معقمة نظيفة؛ ولا تُبذل أي محاولة لرد الكسر في الميدان حتى لو برز العظم."}},

        {q:{en:"Restoring fracture fragments to their normal anatomical position and alignment is called:", ar:"إعادة شظايا الكسر إلى وضعها التشريحي الطبيعي ومحاذاتها تُسمى:"},
         options:[
           {en:"Traction", ar:"الشد"},
           {en:"Reduction", ar:"الرد"},
           {en:"Fixation", ar:"التثبيت"},
           {en:"Debridement", ar:"التنضير"}
         ], correct:1,
         exp:{en:"Reduction (\"setting\" the bone) restores fracture fragments to normal anatomical alignment.", ar:"الرد (\"تثبيت\" العظم) يعيد شظايا الكسر إلى محاذاتها التشريحية الطبيعية."}},

        {q:{en:"Which type of reduction is a non-surgical manual realignment, usually performed under x-ray guidance?", ar:"أيّ نوع من الرد هو إعادة محاذاة يدوية غير جراحية تُجرى عادة تحت توجيه الأشعة؟"},
         options:[
           {en:"Open reduction", ar:"الرد المفتوح"},
           {en:"Closed reduction", ar:"الرد المغلق"},
           {en:"Internal fixation", ar:"التثبيت الداخلي"},
           {en:"External fixation", ar:"التثبيت الخارجي"}
         ], correct:1,
         exp:{en:"Closed reduction is non-surgical manual realignment, typically under x-ray guidance and local or general anesthesia.", ar:"الرد المغلق هو إعادة محاذاة يدوية غير جراحية، عادة تحت توجيه الأشعة وبتخدير موضعي أو عام."}},

        {q:{en:"ORIF stands for:", ar:"يشير مصطلح ORIF إلى:"},
         options:[
           {en:"Open Reduction and Internal Fixation", ar:"الرد المفتوح والتثبيت الداخلي"},
           {en:"Orthopedic Repair and Immediate Fixation", ar:"الإصلاح العظمي والتثبيت الفوري"},
           {en:"Overall Reduction of Injured Fractures", ar:"الرد الشامل للكسور المصابة"},
           {en:"Osteotomy and Reconstructive Internal Fixation", ar:"قطع العظم والتثبيت الداخلي الترميمي"}
         ], correct:0,
         exp:{en:"ORIF = Open Reduction and Internal Fixation: surgical realignment plus hardware fixation.", ar:"ORIF تعني الرد المفتوح والتثبيت الداخلي: إعادة محاذاة جراحية مع تثبيت بالأجهزة."}},

        {q:{en:"Pins, wires, screws, plates, nails, and rods used to hold bone fragments in place are examples of:", ar:"الدبابيس والأسلاك والبراغي والصفائح والمسامير والقضبان المستخدمة لتثبيت شظايا العظم هي أمثلة على:"},
         options:[
           {en:"External fixation devices", ar:"أجهزة التثبيت الخارجي"},
           {en:"Internal fixation devices", ar:"أجهزة التثبيت الداخلي"},
           {en:"Traction devices", ar:"أجهزة الشد"},
           {en:"Assistive ambulation devices", ar:"أجهزة مساعدة على المشي"}
         ], correct:1,
         exp:{en:"These metallic implants are internal fixation devices that hold bone fragments until healing occurs.", ar:"هذه الزرعات المعدنية هي أجهزة تثبيت داخلي تُبقي شظايا العظم ثابتة حتى يحدث الشفاء."}},

        {q:{en:"Which of the following is a method of EXTERNAL immobilization?", ar:"أيّ مما يلي يُعد وسيلة تثبيت خارجي؟"},
         options:[

           {en:"A cast", ar:"الجبس"},
           {en:"A K-wire", ar:"سلك K"}
         ], correct:2,
         exp:{en:"Casts, splints, bandages, traction, and external fixator frames are external immobilization methods.", ar:"الجبس والجبائر والضمادات والشد وأطر التثبيت الخارجي هي وسائل تثبيت خارجي."}},

        {q:{en:"For a patient with a fresh open fracture, the nurse should anticipate administering:", ar:"لمريض مصاب بكسر مفتوح حديث، يجب على الممرضة توقع إعطاء:"},
         options:[
           {en:"Tetanus prophylaxis and IV antibiotics", ar:"الوقاية من الكزاز والمضادات الحيوية الوريدية"},
           {en:"Oral iron supplements only", ar:"مكملات الحديد الفموية فقط"},
           {en:"Bisphosphonates", ar:"البيسفوسفونات"},
           {en:"Calcitonin", ar:"الكالسيتونين"}
         ], correct:0,
         exp:{en:"Open fractures carry a risk of tetanus and infection, so tetanus prophylaxis and IV antibiotics are given.", ar:"الكسور المفتوحة تحمل خطر الكزاز والعدوى، لذا تُعطى الوقاية من الكزاز والمضادات الحيوية الوريدية."}},

        {q:{en:"In the management of an open fracture, primary wound closure is typically:", ar:"في إدارة الكسر المفتوح، يكون إغلاق الجرح الأولي عادة:"},
         options:[

           {en:"Delayed", ar:"مؤجّلًا"},
           {en:"Never necessary", ar:"غير ضروري إطلاقًا"},
           {en:"Done only with tissue glue", ar:"يُنجز فقط باستخدام الغراء النسيجي"}
         ], correct:1,
         exp:{en:"With an open fracture, primary wound closure is delayed to allow swelling to resolve and to reduce infection risk.", ar:"يتأخر إغلاق الجرح الأولي في الكسر المفتوح للسماح بانحسار التورم وتقليل خطر العدوى."}},

        {q:{en:"Buck's traction and trochanter rolls are nursing interventions typically used for a patient with:", ar:"شد باك ولفائف التروكانتر هي تدخلات تمريضية تُستخدم عادة لمريض مصاب بـ:"},
         options:[
           {en:"A hip fracture", ar:"كسر في الورك"},
           {en:"A carpal tunnel syndrome", ar:"متلازمة النفق الرسغي"},
           {en:"Osteomyelitis of the jaw", ar:"التهاب عظم الفك"},
           {en:"Rheumatoid arthritis of the hands", ar:"التهاب المفاصل الروماتويدي في اليدين"}

         exp:{en:"Buck's traction, trochanter rolls, and hip abduction positioning are classic nursing measures for hip fracture patients.", ar:"شد باك ولفائف التروكانتر ووضعية تباعد الورك من التدابير التمريضية المعتادة لمرضى كسور الورك."}},

        {q:{en:"TED hose and sequential compression devices are applied after orthopedic injury mainly to prevent:", ar:"تُستخدم الجوارب الضاغطة وأجهزة الضغط المتسلسل بعد الإصابة العظمية بشكل رئيسي للوقاية من:"},
         options:[

         exp:{en:"TED hose and sequential compression devices reduce venous stasis and help prevent deep vein thrombosis.", ar:"تقلل الجوارب الضاغطة وأجهزة الضغط المتسلسل من ركود الدم الوريدي وتساعد على منع تخثر الأوردة العميقة."}}

    {

      tile: {sym:"Os", num:"76", theme:"yellow"},
      title: {en:"Musculoskeletal System Overview", ar:"نظرة عامة على الجهاز العضلي الهيكلي"},
      blurb: {
        en:"Bones, muscles, and joints, physical assessment, diagnostic studies, and soft-tissue trauma such as strains, sprains, and dislocations.",
        ar:"العظام والعضلات والمفاصل، التقييم الجسدي، الدراسات التشخيصية، وإصابات الأنسجة الرخوة كالإجهاد والالتواء والخلع."
      },
      sections: [
        {
          title:{en:"Anatomy Overview", ar:"نظرة تشريحية عامة"},
          points:[
            {en:"The musculoskeletal system supports the body, enables movement, and protects internal organs.", ar:"يدعم الجهاز العضلي الهيكلي الجسم، ويمكّنه من الحركة، ويحمي الأعضاء الداخلية."},
            {en:"The skeleton is divided into the axial skeleton (skull and trunk) and the appendicular skeleton (limbs, including the shoulder and pelvic girdles).", ar:"يُقسم الهيكل العظمي إلى الهيكل المحوري (الجمجمة والجذع) والهيكل الطرفي (الأطراف، بما فيها الحزام الكتفي والحوضي)."},
            {en:"Main skeletal functions: support, protection of organs, movement (bones/muscles act as levers), mineral storage (calcium, phosphorus), and blood cell formation.", ar:"الوظائف الرئيسية للهيكل: الدعم، حماية الأعضاء، الحركة (تعمل العظام والعضلات كروافع)، تخزين المعادن (الكالسيوم والفوسفور)، وتكوين خلايا الدم."}
          ]
        },
        {
          title:{en:"Bone Structure", ar:"بنية العظام"},
          points:[
            {en:"The adult human body has 206 bones, classified as short, long, flat, and irregular bones.", ar:"يحتوي جسم الإنسان البالغ على 206 عظام، وتُصنَّف إلى عظام قصيرة وطويلة ومسطحة وغير منتظمة."},
            {en:"Compact bone is smooth and dense, forming the shaft of long bones and the outer layer of other bones.", ar:"العظم المضغوط ناعم وكثيف، ويشكّل جسم العظام الطويلة والطبقة الخارجية لبقية العظام."},
            {en:"Spongy bone contains spaces and houses bone marrow.", ar:"العظم الإسفنجي يحتوي على فراغات ويحتوي نخاع العظم."},
            {en:"Red bone marrow (in flat bones like the sternum, ribs, and ilium) produces blood cells and hemoglobin; yellow bone marrow (in the shaft of long bones) is mostly fat and connective tissue.", ar:"النخاع الأحمر (في العظام المسطحة كالقص والأضلاع والحرقفة) ينتج خلايا الدم والهيموغلوبين؛ والنخاع الأصفر (في جسم العظام الطويلة) يتكون غالبًا من الدهون والنسيج الضام."}
          ]
        },
        {
          title:{en:"Muscles", ar:"العضلات"},
          points:[
            {en:"Skeletal (voluntary) muscle allows voluntary movement; there are about 600 skeletal muscles built of fibers whose contraction is triggered by acetylcholine release.", ar:"العضلات الهيكلية (الإرادية) تسمح بالحركة الإرادية؛ ويوجد نحو 600 عضلة هيكلية مكوّنة من ألياف تنقبض عند إفراز الأستيل كولين."},
            {en:"Smooth (involuntary) muscle is controlled internally, e.g., bladder wall and GI tract muscles.", ar:"العضلات الملساء (اللاإرادية) تتحكم بها آلية داخلية، كعضلات جدار المثانة والجهاز الهضمي."},
            {en:"Cardiac muscle (involuntary) is found only in the heart.", ar:"العضلة القلبية (اللاإرادية) توجد فقط في القلب."}
          ]
        },
        {
          title:{en:"Joints, Tendons, Ligaments, Cartilage & Bursae", ar:"المفاصل والأوتار والأربطة والغضاريف والأجربة"},
          points:[
            {en:"A joint is the junction between two or more bones. Free-moving (diarthrodial) joints make up most skeletal joints.", ar:"المفصل هو نقطة اتصال بين عظمين أو أكثر. المفاصل الحرة الحركة تشكل معظم مفاصل الهيكل."},
            {en:"Joint types: synarthrosis (immovable, e.g., skull sutures), amphiarthrosis (slightly movable, e.g., vertebral joints), and diarthrosis/synovial (freely movable, e.g., shoulder, hip).", ar:"أنواع المفاصل: المفصل الليفي (غير متحرك، كدروز الجمجمة)، المفصل الغضروفي (قليل الحركة، كمفاصل الفقرات)، والمفصل الزليلي (حر الحركة، كالكتف والورك)."},
            {en:"Tendons are fibrous bands connecting bone to muscle; ligaments are bands connecting bone to bone and provide joint stability.", ar:"الأوتار أشرطة ليفية تربط العظم بالعضلة؛ والأربطة أشرطة تربط العظم بالعظم وتوفر ثبات المفصل."},
            {en:"Cartilage reduces friction between joint surfaces, absorbs shock, and reduces stress on joints.", ar:"الغضروف يقلل الاحتكاك بين أسطح المفصل، ويمتص الصدمات، ويقلل الإجهاد على المفاصل."},
            {en:"A bursa is a small sac of synovial fluid that reduces friction between tendon, bone, and ligament.", ar:"الجراب كيس صغير مملوء بالسائل الزليلي يقلل الاحتكاك بين الوتر والعظم والرباط."}
          ]
        },
        {
          title:{en:"General Assessment — History & Physical Exam", ar:"التقييم العام — التاريخ المرضي والفحص الجسدي"},
          points:[
            {en:"History focuses on whether the disorder is chronic or a recent injury; onset, duration, and location of pain; tetanus immunization history; and occupational and chronic-disease history.", ar:"يركّز التاريخ المرضي على ما إذا كان الاضطراب مزمنًا أو إصابة حديثة، وبداية الألم ومدته وموضعه، وتاريخ تطعيم الكزاز، والتاريخ المهني والأمراض المزمنة."},
            {en:"Physical exam: inspect size, alignment, and symmetry; palpate for pain, tenderness, swelling, redness; observe ROM and muscle wasting; assess circulation, pulse, skin color, temperature, capillary refill, and sensation.", ar:"الفحص الجسدي: فحص الحجم والمحاذاة والتماثل؛ الجس بحثًا عن الألم والحساسية والتورم والاحمرار؛ ملاحظة مدى الحركة وضمور العضلات؛ وتقييم الدورة الدموية والنبض ولون الجلد والحرارة وإعادة تعبئة الشعيرات والإحساس."}
          ]
        },
        {
          title:{en:"Diagnostic Studies", ar:"الدراسات التشخيصية"},
          points:[
            {en:"Imaging (x-ray, CT, MRI) identifies fractures, dislocations, malignant lesions, joint deformity, calcification, degenerative changes, osteoporosis, and joint disease.", ar:"التصوير (أشعة سينية، مقطعي، رنين مغناطيسي) يحدد الكسور والخلوع والآفات الخبيثة وتشوهات المفاصل والتكلس والتغيرات التنكسية وهشاشة العظام وأمراض المفاصل."},
            {en:"Arthrocentesis: aspiration of synovial fluid, used to relieve painful accumulation or inject medication such as corticosteroids.", ar:"بزل المفصل: سحب السائل الزليلي، يُستخدم لتخفيف التراكم المؤلم أو حقن دواء كالكورتيكوستيرويد."},
            {en:"Arthroscopy: a flexible fiberoptic scope views joint structures directly to identify torn tendons/ligaments, meniscal injury, inflammatory changes, or damaged cartilage.", ar:"تنظير المفصل: منظار مرن يعرض هياكل المفصل مباشرة لاكتشاف تمزق الأوتار أو الأربطة أو إصابة الغضروف الهلالي أو التغيرات الالتهابية أو تلف الغضروف."},
            {en:"Bone densitometry/sonometry estimates bone mineral density; a bone scan detects metastatic lesions, fractures, and inflammatory disorders via radionuclide uptake.", ar:"قياس كثافة العظام يقدّر كثافة المعادن العظمية؛ ومسح العظام يكتشف الآفات النقيلية والكسور والاضطرابات الالتهابية عبر امتصاص النظائر المشعة."},
            {en:"Electromyography (EMG) tests electrical activity of muscles and nerves to evaluate weakness and differentiate muscle from nerve problems.", ar:"تخطيط العضلات الكهربائي يفحص النشاط الكهربائي للعضلات والأعصاب لتقييم الضعف والتمييز بين مشاكل العضلات والأعصاب."},
            {en:"Blood tests: elevated ALP suggests bone tumors or healing fractures; decreased calcium suggests osteomalacia/osteoporosis/bone tumors; elevated uric acid suggests gout; elevated ANA suggests lupus.", ar:"فحوصات الدم: ارتفاع الفوسفاتاز القلوية يوحي بأورام عظمية أو كسور تلتئم؛ انخفاض الكالسيوم يوحي بتلين العظام أو هشاشتها أو أورام عظمية؛ ارتفاع حمض اليوريك يوحي بالنقرس؛ وارتفاع الأجسام المضادة للنواة يوحي بالذئبة."}
          ]
        },
        {
          title:{en:"Musculoskeletal Trauma — Overview", ar:"إصابات الجهاز العضلي الهيكلي — نظرة عامة"},
          points:[
            {en:"Injuries to the musculoskeletal system can affect surrounding muscle, blood vessels, and nerves — not just the bone or muscle itself.", ar:"إصابات الجهاز العضلي الهيكلي قد تؤثر على العضلات والأوعية والأعصاب المحيطة، وليس فقط على العظم أو العضلة نفسها."},
            {en:"Treatment involves immobilization until healing occurs, and preventing further injury or complications.", ar:"يشمل العلاج تثبيت المنطقة حتى الشفاء، ومنع مزيد من الإصابة أو المضاعفات."}
          ]
        },
        {
          title:{en:"Strains", ar:"الإجهاد العضلي"},
          points:[
            {en:"A strain is injury to a muscle-tendon unit from stretching or pulling beyond its capacity — a microscopic tear that may bleed (a \"pulled muscle\").", ar:"الإجهاد هو إصابة وحدة العضلة والوتر بسبب تمدد أو شد يتجاوز طاقتها — تمزق مجهري قد ينزف (\"شد عضلي\")."},
            {en:"Symptoms: pain or cramping, swelling, heat, redness, and loss of function in the area.", ar:"الأعراض: ألم أو تشنج، تورم، حرارة، احمرار، وفقدان وظيفة المنطقة."},
            {en:"Management follows RICE (Rest, Ice, Compression, Elevation) for the first 24–48 hours, then heat after swelling stabilizes; NSAIDs, splinting/casting, and gradual active exercise as healing progresses.", ar:"تتبع الإدارة مبدأ RICE (الراحة، الثلج، الضغط، الرفع) خلال أول 24–48 ساعة، ثم الحرارة بعد استقرار التورم؛ إضافة إلى مضادات الالتهاب، التجبير، وتمارين نشطة تدريجية مع الشفاء."}
          ]
        },
        {
          title:{en:"Contusions", ar:"الكدمات"},
          points:[
            {en:"A contusion is a soft-tissue injury from a blow or blunt trauma with no break in the skin, appearing as ecchymosis (bruise); a hematoma forms if bleeding is more than slight.", ar:"الكدمة إصابة في الأنسجة الرخوة ناتجة عن ضربة أو رض حاد دون تمزق بالجلد، وتظهر كإكيموزيس (كدمة)؛ ويتكوّن الورم الدموي إذا كان النزف أكثر من طفيف."},
            {en:"Nursing management: elevate and apply cold compresses for the first 8–12 hours (causes vasoconstriction, reducing bleeding/edema), then switch to moist heat to promote tissue repair.", ar:"الإدارة التمريضية: رفع المنطقة ووضع كمادات باردة أول 8–12 ساعة (تسبب تضيق الأوعية وتقليل النزف والوذمة)، ثم التحول إلى الحرارة الرطبة لتعزيز إصلاح الأنسجة."}
          ]
        },
        {
          title:{en:"Sprains", ar:"الالتواء"},
          points:[
            {en:"A sprain is an injury to the ligaments surrounding a joint, from twisting, overstretching, or tearing.", ar:"الالتواء إصابة في الأربطة المحيطة بالمفصل، ناتجة عن الالتواء أو التمدد المفرط أو التمزق."},
            {en:"Grading: Grade I — mild bleeding/inflammation; Grade II — severe stretching with some tearing, inflammation, and hematoma; Grade III — complete ligament tear; Grade IV — bony attachment of the ligament torn away.", ar:"التدريج: الدرجة الأولى — نزف والتهاب خفيف؛ الدرجة الثانية — تمدد شديد مع بعض التمزق والتهاب وورم دموي؛ الدرجة الثالثة — تمزق كامل للرباط؛ الدرجة الرابعة — انفصال الملتصق العظمي للرباط."},
            {en:"The wrist, elbow, knee, and ankle are most commonly sprained; a cervical spine sprain is commonly called whiplash.", ar:"أكثر المناطق عرضة للالتواء: المعصم، المرفق، الركبة، والكاحل؛ والتواء العمود الفقري العنقي يُعرف عادة بإصابة السوط (whiplash)."},
            {en:"Management: immobilize with a splint, rest and elevate, apply cold then heat as with a contusion (RICE), and use NSAIDs.", ar:"الإدارة: التثبيت بجبيرة، الراحة والرفع، تطبيق البرودة ثم الحرارة كما في الكدمة (RICE)، واستخدام مضادات الالتهاب غير الستيرويدية."}
          ]
        },
        {
          title:{en:"Dislocations", ar:"الخلع"},
          points:[
            {en:"A dislocation occurs when joint surfaces are no longer in contact; a partial dislocation is called a subluxation. The shoulder, hip, and knee are commonly affected.", ar:"يحدث الخلع عندما لا تعود أسطح المفصل متلامسة؛ ويُسمى الخلع الجزئي بالانخلاع الجزئي (Subluxation). يتأثر الكتف والورك والركبة عادة."},
            {en:"In adults, trauma is the usual cause; joint disease can also weaken ligaments and cause dislocation.", ar:"عند البالغين، الرضّ هو السبب المعتاد؛ كما يمكن لأمراض المفصل أن تُضعف الأربطة وتسبب الخلع."},
            {en:"Complications: compartment syndrome, subsequent palsy, Volkmann's contracture (claw-like hand deformity from obstructed arterial flow), and recurrent dislocation from ligament laxity.", ar:"المضاعفات: متلازمة الحيّز، الشلل اللاحق، تقفّع فولكمان (تشوه يشبه المخلب باليد بسبب انسداد التدفق الشرياني)، وتكرار الخلع بسبب ارتخاء الأربطة."},
            {en:"Assessment findings: a popping sound, the joint \"gave out,\" pain, muscle spasm, altered joint shape, misalignment, limb shortening, and limited ROM.", ar:"نتائج التقييم: صوت فرقعة، شعور المريض بأن المفصل \"انفك\"، ألم، تشنج عضلي، تغيّر شكل المفصل، سوء المحاذاة، قصر الطرف، ومحدودية الحركة."},
            {en:"Management: the physician reduces the joint and immobilizes it with a bandage, cast, or splint for several weeks; surgery may be needed. Nursing: analgesics, elevation and cold packs, and frequent neurovascular checks (every 30 minutes initially, then every 2–4 hours).", ar:"الإدارة: يقوم الطبيب برد المفصل وتثبيته بضمادة أو جبس أو جبيرة لعدة أسابيع؛ وقد تلزم الجراحة. تمريضيًا: المسكنات، الرفع وكمادات البرودة، وفحص الحالة العصبية الوعائية بشكل متكرر (كل 30 دقيقة مبدئيًا ثم كل 2–4 ساعات)."}
          ]
        },
        {
          title:{en:"Overuse Injuries — Tendonitis, Epicondylitis & Carpal Tunnel Syndrome", ar:"إصابات الإفراط بالاستخدام — التهاب الأوتار واللقيمة والنفق الرسغي"},
          points:[
            {en:"Tendonitis is inflammation of a tendon from overuse; epicondylitis (\"tennis elbow\") causes pain radiating down the forearm and weak grip.", ar:"التهاب الأوتار هو التهاب الوتر بسبب الإفراط بالاستخدام؛ والتهاب اللقيمة (\"كوع التنس\") يسبب ألمًا ينتشر أسفل الساعد وضعف القبضة."},
            {en:"Carpal tunnel syndrome results from repetitive wrist motion causing swelling that compresses the median nerve in the carpal canal.", ar:"متلازمة النفق الرسغي تنتج عن حركة معصم متكررة تسبب تورمًا يضغط على العصب المتوسط داخل النفق الرسغي."},
            {en:"Symptoms: pain/burning in the hand(s) worse at night, sensory loss in the thumb/index/middle fingers, and difficulty making a fist. A positive Tinel's sign or Phalen's sign supports the diagnosis.", ar:"الأعراض: ألم أو حرقان في اليد يزداد ليلًا، فقدان إحساس بالإبهام والسبابة والوسطى، وصعوبة تكوين قبضة. علامة تينل أو فالن الإيجابية تدعم التشخيص."},
            {en:"Management: cold/heat, exercise, NSAIDs, corticosteroid injections, splinting to rest the joint, and surgery to release pressure on the median nerve if conservative treatment fails.", ar:"الإدارة: البرودة والحرارة، التمارين، مضادات الالتهاب، حقن الكورتيكوستيرويد، تجبير المفصل للراحة، والجراحة لتحرير الضغط عن العصب المتوسط عند فشل العلاج المحافظ."}
          ]
        },

        {q:{en:"Which type of bone tissue is smooth, dense, and forms the shaft of long bones?", ar:"أيّ نوع من النسيج العظمي ناعم وكثيف ويشكّل جسم العظام الطويلة؟"},
         options:[

           {en:"Periosteal tissue", ar:"نسيج السمحاق"}
         ], correct:1,
         exp:{en:"Compact bone is smooth and dense, forming the shaft of long bones and the outer layer of other bones.", ar:"العظم المضغوط ناعم وكثيف، ويشكل جسم العظام الطويلة والطبقة الخارجية لبقية العظام."}},

           {en:"Absorb shock at joint surfaces", ar:"امتصاص الصدمات عند أسطح المفاصل"},
           {en:"Connect bone to muscle", ar:"ربط العظم بالعضلة"}
         ], correct:1,
         exp:{en:"Red bone marrow, found in flat bones, produces blood cells and hemoglobin; yellow marrow is mostly fat.", ar:"النخاع الأحمر، الموجود في العظام المسطحة، ينتج خلايا الدم والهيموغلوبين؛ أما النخاع الأصفر فهو غالبًا دهون."}},

        {q:{en:"Which joint type is immovable, such as the sutures of the skull?", ar:"أيّ نوع من المفاصل غير متحرك، مثل دروز الجمجمة؟"},

           {en:"Bursa joint", ar:"مفصل الجراب"}

         exp:{en:"Synarthrosis joints, like skull sutures, are immovable.", ar:"المفاصل الليفية (Synarthrosis)، كدروز الجمجمة، غير متحركة."}},

        {q:{en:"Which joint type is freely movable, such as the shoulder or hip?", ar:"أيّ نوع من المفاصل حر الحركة، كالكتف أو الورك؟"},
         options:[
           {en:"Synarthrosis", ar:"المفصل الليفي"},
           {en:"Amphiarthrosis", ar:"المفصل الغضروفي"},
           {en:"Diarthrosis (synovial)", ar:"المفصل الزليلي"},
           {en:"Symphysis", ar:"الارتفاق"}

        {q:{en:"Tendons connect:", ar:"الأوتار تربط:"},
         options:[

           {en:"Cartilage to cartilage", ar:"الغضروف بالغضروف"}

        {q:{en:"Ligaments connect:", ar:"الأربطة تربط:"},
         options:[

           {en:"Bone to bone", ar:"العظم بالعظم"},
           {en:"Muscle to muscle", ar:"العضلة بالعضلة"},
           {en:"Nerve to bone", ar:"العصب بالعظم"}

         exp:{en:"Ligaments are bands of connective tissue connecting bone to bone, providing joint stability.", ar:"الأربطة أشرطة من النسيج الضام تربط العظم بالعظم وتوفر ثبات المفصل."}},

        {q:{en:"A bursa is best described as:", ar:"يُوصف الجراب بأنه:"},
         options:[

           {en:"A type of long bone", ar:"نوع من العظام الطويلة"},
           {en:"A muscle fiber bundle", ar:"حزمة من ألياف العضلات"}

         exp:{en:"A bursa is a small synovial-fluid-filled sac that reduces friction between tendon, bone, and ligament.", ar:"الجراب كيس صغير مملوء بالسائل الزليلي يقلل الاحتكاك بين الوتر والعظم والرباط."}},

        {q:{en:"An elevated alkaline phosphatase (ALP) level may indicate:", ar:"ارتفاع مستوى الفوسفاتاز القلوية قد يشير إلى:"},
         options:[

           {en:"A muscle strain", ar:"إجهاد عضلي"}

        {q:{en:"A strain is best defined as:", ar:"يُعرَّف الإجهاد العضلي بأنه:"},

           {en:"A break in the continuity of bone", ar:"انقطاع في استمرارية العظم"},
           {en:"Complete separation of joint surfaces", ar:"انفصال كامل لأسطح المفصل"}

         exp:{en:"A strain is a muscle/tendon injury from being stretched or pulled beyond its capacity.", ar:"الإجهاد إصابة العضلة أو الوتر بسبب تمدد أو شد يتجاوز طاقتها."}},

         exp:{en:"A contusion is a soft-tissue injury from blunt trauma, with no skin break, appearing as ecchymosis.", ar:"الكدمة إصابة أنسجة رخوة من رض حاد، دون تمزق بالجلد، وتظهر كإكيموزيس."}},

        {q:{en:"The acronym RICE, used for strains, contusions, and sprains, stands for:", ar:"اختصار RICE المستخدم للإجهاد والكدمات والالتواء يعني:"},

        {q:{en:"A Grade IV sprain is characterized by:", ar:"يتميّز التواء الدرجة الرابعة بـ:"},

        {q:{en:"A partial dislocation, where joint surfaces are not completely separated, is called:", ar:"الخلع الجزئي، حيث لا تنفصل أسطح المفصل تمامًا، يُسمى:"},

        {q:{en:"After a joint dislocation is reduced, the nurse should initially assess neurovascular status:", ar:"بعد رد الخلع، يجب على الممرضة تقييم الحالة العصبية الوعائية مبدئيًا:"},

         exp:{en:"Carpal tunnel syndrome results from swelling that compresses the median nerve within the carpal canal.", ar:"تنتج متلازمة النفق الرسغي عن تورم يضغط على العصب المتوسط داخل النفق الرسغي."}},

            {en:"Pathophysiology: bone resorption exceeds formation, calcium/phosphate are lost, bones become porous and fragile, and vertebral mass loss can cause kyphosis and height loss.", ar:"الفيزيولوجيا المرضية: يفوق امتصاص العظم تكوينه، فتُفقد أملاح الكالسيوم والفوسفات، وتصبح العظام مسامية وهشة، وقد يؤدي فقدان كتلة الفقرات إلى الحداب وقصر القامة."},
            {en:"Risk factors: genetics, aging, poor nutrition, smoking/caffeine/alcohol, immobility, renal or liver failure, hyperthyroidism, hyperparathyroidism, and long-term corticosteroid use.", ar:"عوامل الخطر: الوراثة، التقدم بالعمر، سوء التغذية، التدخين والكافيين والكحول، الخمول، الفشل الكلوي أو الكبدي، فرط نشاط الغدة الدرقية أو جارات الدرقية، والاستخدام طويل الأمد للكورتيكوستيرويدات."},
            {en:"Complications: fractures and bone deformities.", ar:"المضاعفات: الكسور وتشوهات العظام."},
            {en:"Medical management: a balanced diet rich in calcium and vitamin D, vitamin C to enhance calcium absorption, exercise, and hormone replacement (estrogen/progesterone) at menopause.", ar:"الإدارة الطبية: نظام غذائي متوازن غني بالكالسيوم وفيتامين د، فيتامين س لتعزيز امتصاص الكالسيوم، التمارين الرياضية، والعلاج الهرموني (إستروجين/بروجستيرون) عند انقطاع الطمث."},
            {en:"Pharmacologic therapy: calcium and vitamin D, bisphosphonates (prevent bone-density loss), calcitonin, estrogen agonists/antagonists, and parathyroid hormone (stimulates bone formation).", ar:"العلاج الدوائي: الكالسيوم وفيتامين د، البيسفوسفونات (تمنع فقدان كثافة العظم)، الكالسيتونين، منشطات/مضادات مستقبلات الإستروجين، وهرمون جارات الدرقية (يحفّز تكوين العظم)."},
            {en:"Prevention: lifelong calcium/vitamin D intake, weight-bearing exercise 20–30 minutes daily (improves balance, reduces falls and fractures), and weight training to stimulate bone mineral density.", ar:"الوقاية: تناول الكالسيوم وفيتامين د مدى الحياة، تمارين تحمل الوزن 20–30 دقيقة يوميًا (تحسّن التوازن وتقلل السقوط والكسور)، وتمارين المقاومة لتحفيز كثافة المعادن العظمية."},
            {en:"Nursing management: adequate calcium intake, regular exercise, smoking/caffeine/alcohol cessation, bowel management (fiber, fluids, stool softeners), injury prevention, and pain relief with rest, a firm mattress, and knee flexion.", ar:"الإدارة التمريضية: تناول كافٍ من الكالسيوم، ممارسة رياضية منتظمة، التوقف عن التدخين والكافيين والكحول، إدارة الإخراج (ألياف، سوائل، ملينات)، الوقاية من الإصابة، وتخفيف الألم بالراحة والمرتبة الصلبة وثني الركبة."}
          ]
        },
        {
          title:{en:"Osteomalacia", ar:"تلين العظام"},
          points:[
            {en:"Definition: a metabolic bone disease from inadequate mineralization that softens and weakens the skeleton.", ar:"التعريف: مرض عظمي استقلابي ناتج عن نقص التمعدن، يُضعف الهيكل العظمي ويُليّنه."},
            {en:"Clinical features: bone pain, tenderness to touch, bowing of long bones, pathologic fractures, and a waddling gait from skeletal deformity.", ar:"السمات السريرية: ألم عظمي، حساسية عند اللمس، انحناء العظام الطويلة، كسور مرضية، ومشية متمايلة بسبب التشوه الهيكلي."},
            {en:"Cause: deficiency of activated vitamin D needed for calcium absorption and bone mineralization — due to malabsorption disorders, liver/kidney disease, hyperparathyroidism, prolonged anticonvulsant use, or inadequate diet/sunlight.", ar:"السبب: نقص فيتامين د المنشط اللازم لامتصاص الكالسيوم وتمعدن العظم — بسبب اضطرابات سوء الامتصاص، أمراض الكبد أو الكلى، فرط نشاط الغدة الجار درقية، الاستخدام المطوّل لمضادات التشنج، أو نقص الغذاء أو التعرض للشمس."},
            {en:"Diagnostics: x-rays show generalized demineralization; labs show low serum calcium/phosphorus and moderately elevated ALP; biopsy shows increased unmineralized osteoid (\"prebone\").", ar:"التشخيص: تُظهر الأشعة إزالة معادن معممة؛ وتُظهر التحاليل انخفاض الكالسيوم والفوسفور بالمصل وارتفاعًا متوسطًا بالفوسفاتاز القلوية؛ وتُظهر الخزعة زيادة العظم غير المتمعدن (\"ما قبل العظم\")."},
            {en:"Management: treat the underlying cause, vitamin D supplementation (calcitriol if kidney disease impairs activation), safe sun exposure, dietary measures similar to osteoporosis, and bracing or corrective surgery for persistent deformity.", ar:"الإدارة: علاج السبب الأساسي، مكملات فيتامين د (الكالسيتريول إذا أعاق مرض الكلى تنشيطه)، التعرض الآمن للشمس، تدابير غذائية مشابهة لهشاشة العظام، وتدعيم أو جراحة تصحيحية للتشوهات المستمرة."}
          ]
        },
        {
          title:{en:"Paget Disease of the Bone", ar:"مرض باجيت للعظم"},
          points:[
            {en:"Overview: a disorder of localized, rapid, disorganized bone turnover, most often affecting the skull, femur, tibia, pelvis, and vertebrae; affects about 2–3% of adults over 50.", ar:"نظرة عامة: اضطراب في تجدد العظام السريع والموضعي وغير المنظم، يصيب غالبًا الجمجمة وعظم الفخذ والساق والحوض والفقرات؛ ويصيب نحو 2–3% من البالغين فوق سن الخمسين."},
            {en:"Pathophysiology: excessive osteoclastic activity increases resorption, followed by compensatory osteoblastic activity, producing a disorganized \"mosaic\" bone pattern that is highly vascular but structurally weak.", ar:"الفيزيولوجيا المرضية: نشاط ناقضات العظم المفرط يزيد الامتصاص، يليه نشاط تعويضي لبانيات العظم، ما ينتج نمطًا \"فسيفسائيًا\" غير منظم من عظم شديد الأوعية لكنه ضعيف هيكليًا."},
            {en:"Manifestations: often asymptomatic (found incidentally on x-ray), skull thickening with possible hearing loss, bowing of femurs/tibiae causing a waddling gait, and deep aching bone pain that worsens with weight-bearing.", ar:"المظاهر: غالبًا بلا أعراض (يُكتشف صدفة بالأشعة)، سماكة الجمجمة مع احتمال فقدان السمع، انحناء عظمي الفخذ والساق مسببًا مشية متمايلة، وألم عظمي عميق يزداد مع حمل الوزن."},
            {en:"Diagnostics: elevated serum ALP and urinary hydroxyproline reflect increased bone turnover; serum calcium is typically normal; x-rays show the characteristic mosaic pattern; bone scan shows disease extent.", ar:"التشخيص: ارتفاع الفوسفاتاز القلوية والهيدروكسي برولين البولي يعكس زيادة تجدد العظم؛ الكالسيوم بالمصل طبيعي عادة؛ وتُظهر الأشعة النمط الفسيفسائي المميز؛ ومسح العظام يوضح مدى المرض."},
            {en:"Management: NSAIDs for pain, walking aids/PT for gait problems, weight control, and bisphosphonates as the mainstay pharmacologic therapy; complications include pathologic fractures, degenerative arthritis, and hearing loss.", ar:"الإدارة: مضادات الالتهاب للألم، وسائل مساعدة للمشي والعلاج الطبيعي لمشاكل المشية، ضبط الوزن، والبيسفوسفونات كعلاج دوائي أساسي؛ وتشمل المضاعفات الكسور المرضية والتهاب المفاصل التنكسي وفقدان السمع."}
          ]
        },
        {
          title:{en:"Osteomyelitis", ar:"التهاب العظم والنقي"},
          points:[
            {en:"Definition: infection of the bone, occurring via extension of soft-tissue infection, direct contamination (e.g., bone surgery), or hematogenous (blood-borne) spread.", ar:"التعريف: عدوى في العظم، تحدث عبر امتداد عدوى الأنسجة الرخوة، أو التلوث المباشر (كجراحة العظام)، أو الانتشار الدموي."},
            {en:"Risk factors: poor nutrition, older age, obesity, impaired immunity, chronic illness (diabetes, rheumatoid arthritis), and long-term corticosteroid therapy.", ar:"عوامل الخطر: سوء التغذية، تقدم العمر، السمنة، ضعف المناعة، الأمراض المزمنة (السكري، التهاب المفاصل الروماتويدي)، والعلاج طويل الأمد بالكورتيكوستيرويد."},
            {en:"Hematogenous spread produces systemic signs of septicemia (chills, high fever, rapid pulse, malaise) plus a painful, swollen, tender area; contiguous spread causes local swelling/warmth/pain without septicemia; chronic osteomyelitis causes recurrent pain, inflammation, swelling, and drainage.", ar:"الانتشار الدموي يسبب أعراض تسمم دم جهازية (قشعريرة، حمى شديدة، نبض سريع، وهن عام) بالإضافة إلى منطقة مؤلمة ومتورمة وحساسة؛ أما الانتشار المجاور فيسبب تورمًا ودفئًا وألمًا موضعيًا دون تسمم دم؛ ويسبب التهاب العظم المزمن نوبات متكررة من الألم والالتهاب والتورم والإفرازات."},
            {en:"Prevention: postpone elective orthopedic surgery if infection is present, give prophylactic antibiotics, use aseptic surgical technique, remove catheters/drains promptly, and practice aseptic wound care.", ar:"الوقاية: تأجيل جراحة العظام الاختيارية عند وجود عدوى، إعطاء مضادات حيوية وقائية، استخدام تقنية معقمة بالجراحة، إزالة القسطرات والأنابيب مبكرًا، والعناية المعقمة بالجروح."},
            {en:"Complications: progression from acute to chronic disease if poorly managed, growth retardation in children, spread to adjacent joints (septic arthritis), and septicemia.", ar:"المضاعفات: تطور المرض من حاد إلى مزمن عند سوء الإدارة، تأخر النمو عند الأطفال، انتشار العدوى للمفصل المجاور (التهاب المفاصل الإنتاني)، وتسمم الدم."},
            {en:"Medical management: immobilize the area, warm wet soaks 20 minutes several times a day, antibiotic therapy guided by cultures, and surgical management as needed.", ar:"الإدارة الطبية: تثبيت المنطقة، نقع دافئ ورطب 20 دقيقة عدة مرات يوميًا، مضادات حيوية حسب نتائج الزرع، والتدخل الجراحي عند الحاجة."},
            {en:"Nursing management: splint the area to reduce pain/spasm, handle the wound gently, elevate to decrease swelling, monitor neurovascular status and pain control, promote mobility, and ensure a diet high in protein and vitamin C with adequate hydration.", ar:"الإدارة التمريضية: تجبير المنطقة لتقليل الألم والتشنج، التعامل مع الجرح بلطف، رفع الطرف لتقليل التورم، مراقبة الحالة العصبية الوعائية وضبط الألم، تعزيز الحركة، وضمان نظام غذائي غني بالبروتين وفيتامين س مع ترطيب كافٍ."},
            {en:"Patient education: infection-control measures (hand washing, wound drainage disposal, correct dressing), the rationale for long-term antibiotics, continuing ROM exercises, warning signs of infection to report, aseptic dressing technique, and fall/injury prevention.", ar:"تثقيف المريض: تدابير مكافحة العدوى (غسل اليدين، التخلص من إفرازات الجرح، التضميد الصحيح)، مبررات المضادات الحيوية طويلة الأمد، الاستمرار بتمارين مدى الحركة، علامات التحذير للعدوى الواجب إبلاغها، تقنية التضميد المعقمة، والوقاية من السقوط والإصابة."}
          ]
        },
        {
          title:{en:"Septic (Infectious) Arthritis", ar:"التهاب المفاصل الإنتاني (المعدي)"},
          points:[
            {en:"Cause: joints become infected by hematogenous spread from another body site, or directly by trauma or surgical instrumentation.", ar:"السبب: تُصاب المفاصل بالعدوى عبر الانتشار الدموي من موضع آخر بالجسم، أو مباشرة عبر الرضّ أو الأدوات الجراحية."},
            {en:"Manifestations: a warm, painful, swollen joint with decreased range of motion, plus systemic chills, fever, and leukocytosis.", ar:"المظاهر: مفصل دافئ ومؤلم ومتورم مع نقص مدى الحركة، إضافة إلى قشعريرة جهازية وحمى وارتفاع كريات الدم البيضاء."},
            {en:"Management: IV antibiotics, monitoring synovial fluid for sterility and falling white cell count, joint aspiration to remove excess fluid/debris, immobilizing and supporting the joint, and monitoring nutrition and fluid status.", ar:"الإدارة: المضادات الحيوية الوريدية، مراقبة السائل الزليلي للتأكد من العقم وانخفاض كريات الدم البيضاء، بزل المفصل لإزالة السائل الزائد والحطام، تثبيت المفصل ودعمه، ومراقبة حالة التغذية والسوائل."}
          ]
        },
        {
          title:{en:"Rheumatoid Arthritis", ar:"التهاب المفاصل الروماتويدي"},
          points:[
            {en:"Overview: a chronic autoimmune disease of unknown cause, affecting about 1–2% of the population worldwide; about three times more common in women, with onset typically in the 3rd–6th decade of life and incidence rising after age 60.", ar:"نظرة عامة: مرض مناعي ذاتي مزمن مجهول السبب، يصيب نحو 1–2% من سكان العالم؛ وهو أكثر شيوعًا بنحو ثلاث مرات لدى النساء، ويبدأ عادة بين العقدين الثالث والسادس من العمر، مع ارتفاع معدل الحدوث بعد سن الستين."},
            {en:"Risk factors: family history, environmental/dietary factors, nulliparity, smoking, and obesity.", ar:"عوامل الخطر: التاريخ العائلي، العوامل البيئية والغذائية، عدم الإنجاب، التدخين، والسمنة."},
            {en:"Pathophysiology: an autoimmune reaction in synovial tissue triggers inflammation; the synovium breaks down collagen, causing edema and pannus formation, which destroys cartilage and erodes bone, leading to loss of joint surfaces and motion.", ar:"الفيزيولوجيا المرضية: يُحدث تفاعل مناعي ذاتي بالنسيج الزليلي التهابًا؛ يُفكّك الغشاء الزليلي الكولاجين مسببًا وذمة وتكوّن السبل الذي يدمّر الغضروف ويؤكل العظم، ما يؤدي لفقدان أسطح المفصل وحركته."},
            {en:"Manifestations: symmetric joint pain, swelling, warmth, and morning stiffness lasting more than 1 hour; typically starts in the small joints of the hands, wrists, and feet, progressing to larger joints; can cause deformities (ulnar deviation, swan neck) and systemic features (fever, weight loss, fatigue, anemia, rheumatoid nodules).", ar:"المظاهر: ألم مفصلي متماثل، تورم، دفء، وتيبّس صباحي يستمر أكثر من ساعة؛ يبدأ عادة بالمفاصل الصغيرة لليدين والمعصمين والقدمين، ثم يتطور للمفاصل الأكبر؛ وقد يسبب تشوهات (الانحراف الزندي، رقبة البجعة) وأعراضًا جهازية (حمى، فقدان وزن، تعب، فقر دم، عقيدات روماتويدية)."},
            {en:"Assessment: a scoring system based on joint involvement, serology (rheumatoid factor, anti-CCP antibodies — about 95% specific for RA), elevated ESR/CRP, and symptoms lasting more than 6 weeks; baseline imaging and labs are obtained before starting disease-modifying therapy.", ar:"التقييم: نظام تسجيل نقاط يعتمد على المفاصل المصابة، الفحوصات المصلية (عامل الروماتويد، الأجسام المضادة لببتيد السيترولين الحلقي anti-CCP بنوعية تصل إلى 95%)، ارتفاع سرعة الترسيب والبروتين التفاعلي، واستمرار الأعراض أكثر من 6 أسابيع؛ وتُجرى فحوصات وتصوير أساسي قبل بدء العلاج المعدّل للمرض."},
            {en:"Early management: reduce pain/swelling, achieve remission, and prevent deformity — DMARDs started within 3 months of diagnosis, with methotrexate as the preferred first-line agent; biologic DMARDs (targeting TNF-alpha, B/T cells, IL-1, IL-6) for moderate-to-severe disease; NSAIDs relieve symptoms but do not alter disease progression.", ar:"الإدارة المبكرة: تقليل الألم والتورم، تحقيق الهدأة، ومنع التشوه — تبدأ الأدوية المعدّلة للمرض (DMARDs) خلال 3 أشهر من التشخيص، والميثوتركسيت هو الخط الأول المفضل؛ وتُستخدم الأدوية البيولوجية (تستهدف TNF-alpha وخلايا B/T وIL-1 وIL-6) للحالات المتوسطة إلى الشديدة؛ ومضادات الالتهاب تخفف الأعراض دون أن تغيّر مسار المرض."},
            {en:"Established RA management: occupational/physical therapy (activity pacing, joint protection, ROM, strengthening), combination DMARD therapy as disease progresses, reconstructive surgery when pain persists, and emotional support since depression and sleep disruption are common.", ar:"إدارة المرض المستقر: العلاج الوظيفي والطبيعي (تنظيم النشاط، حماية المفاصل، تمارين مدى الحركة والتقوية)، العلاج المركب بأدوية DMARD مع تقدم المرض، الجراحة الترميمية عند استمرار الألم، والدعم النفسي لأن الاكتئاب واضطرابات النوم شائعة."}
          ]
        }
      ],
      questions: [
        {q:{en:"Osteoporosis is characterized by:", ar:"يتميز مرض هشاشة العظام بـ:"},
         options:[

           {en:"Bacterial infection of the bone marrow", ar:"عدوى بكتيرية في نخاع العظم"},

         options:[

        {q:{en:"Which class of drugs prevents loss of bone density and is a mainstay treatment for both osteoporosis and Paget disease?", ar:"أي فئة من الأدوية تمنع فقدان كثافة العظم وتُعد علاجًا أساسيًا لكل من هشاشة العظام ومرض باجيت؟"},

           {en:"DMARDs", ar:"الأدوية المعدّلة للمرض (DMARDs)"}
         ], correct:0,
         exp:{en:"Bisphosphonates slow bone turnover and are a mainstay treatment for osteoporosis and Paget disease.", ar:"تُبطئ البيسفوسفونات دوران العظم وتُعد علاجًا أساسيًا لهشاشة العظام ومرض باجيت."}},

           {en:"Hematogenous bacterial spread", ar:"انتشار بكتيري دموي"},

        {q:{en:"Classic clinical features of osteomalacia include all of the following EXCEPT:", ar:"من السمات السريرية الكلاسيكية لتلين العظام كل ما يلي ما عدا:"},
         options:[
           {en:"Bone pain and tenderness", ar:"ألم عظمي وحساسية"},

        {q:{en:"Paget disease is best characterized by:", ar:"يتميز مرض باجيت بشكل أساسي بـ:"},

/* ============================= UTIL ============================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildQuizQuestions(sourceQuestions){
  const shuffledQs = shuffle(sourceQuestions);
  return shuffledQs.map(q=>{
    const opts = q.options.map((o,i)=>({text:o, origIndex:i}));
    const shuffledOpts = shuffle(opts);
    const correctIndex = shuffledOpts.findIndex(o=>o.origIndex===q.correct);
    return {
      chapterId: q.chapterId,
      q: q.q,
      exp: q.exp,
      options: shuffledOpts.map(o=>o.text),
      correct: correctIndex
    };
  });
}

function chapterById(id){ return DATA.chapters.find(c=>c.id===id); }

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}
