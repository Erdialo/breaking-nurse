  const scores = getBestScores();
  const chapterCards = DATA.chapters.map(ch=>{
    const best = scores[ch.id];
    return `
    <div class="chcard">
      <div class="chcard-top">
        <div class="tile ${ch.tile.theme==='green'?'tile-green':'tile-yellow'}"><span class="num">${ch.tile.num}</span><span class="sym">${ch.tile.sym}</span></div>
        <h4>${t(ch.title)}</h4>
      </div>
      <p>${t(ch.blurb)}</p>
      <div class="meta">${ch.questions.length} ${tr('questionsWord')}${best?` · ${tr('bestLabel')}: ${best}%`:""}</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-outline" data-nav="study-reader" data-chapter="${ch.id}">${tr('startReading')}</button>
        <button class="btn btn-primary" data-action="start-quiz" data-scope="${ch.id}">${tr('quizThisChapter')}</button>
      </div>
    </div>`;
  }).join("");

  return `
  <section class="hero">
    <h1>Breaking <span class="accent">Nurse</span></h1>
    <p class="sub">${tr('tagline')}</p>
    <div class="cardgrid">
      <div class="bigcard study" data-nav="study-list">
        <div class="stripe"></div>
        <h3>${tr('heroStudyTitle')}</h3>
        <p>${tr('heroStudyDesc')}</p>
        <div class="go">${tr('goStudy')}</div>
      </div>
      <div class="bigcard quiz" data-nav="quiz-list">
        <div class="stripe"></div>
        <h3>${tr('heroQuizTitle')}</h3>
        <p>${tr('heroQuizDesc')}</p>
        <div class="go">${tr('goQuiz')}</div>
      </div>
    </div>
  </section>
  <h2 class="section-title">${tr('chaptersHeading')}</h2>
  <div class="chapterlist">${chapterCards}</div>
  `;
}

function renderStudyList(){
  const cards = DATA.chapters.map(ch=>`
    <div class="chcard">
      <div class="chcard-top">
        <div class="tile ${ch.tile.theme==='green'?'tile-green':'tile-yellow'}"><span class="num">${ch.tile.num}</span><span class="sym">${ch.tile.sym}</span></div>
        <h4>${t(ch.title)}</h4>
      </div>
      <p>${t(ch.blurb)}</p>
      <div class="meta">${ch.sections.length} ${state.lang==='ar'?'أقسام':'sections'}</div>
      <button class="btn btn-primary btn-block" data-nav="study-reader" data-chapter="${ch.id}">${tr('startReading')}</button>
    </div>
  `).join("");
  return `
    <h2 class="section-title">${tr('chaptersHeading')}</h2>
    <div class="chapterlist">${cards}</div>
  `;
}

function renderStudyReader(){
  const ch = chapterById(state.chapterId) || DATA.chapters[0];
  state.chapterId = ch.id;
  const sections = ch.sections.map((sec, i)=>{
    const isOpen = state.openAcc[ch.id+"_"+i];
    const points = sec.points.map(p=>`<li>${t(p)}</li>`).join("");
    return `
    <div class="acc-item ${isOpen?'open':''}">
      <div class="acc-head" data-acc="${ch.id}_${i}">
        <div class="acc-head-left"><span class="num">${i+1}</span><span>${t(sec.title)}</span></div>
        <span class="acc-chevron">${state.lang==='ar'?'◀':'▶'}</span>
      </div>
      <div class="acc-body"><div class="acc-body-inner"><ul>${points}</ul></div></div>
    </div>`;
  }).join("");

  return `
    <button class="backlink" data-nav="study-list">${state.lang==='ar'?'→':'←'} ${tr('backToChapters')}</button>
    <div class="reader-head">
      <div class="tile ${ch.tile.theme==='green'?'tile-green':'tile-yellow'}" style="width:50px;height:50px;"><span class="num">${ch.tile.num}</span><span class="sym" style="font-size:20px;">${ch.tile.sym}</span></div>
      <h1>${t(ch.title)}</h1>
    </div>
    <p class="reader-blurb">${t(ch.blurb)}</p>
    <div class="accordion">${sections}</div>
    <div class="reader-actions">
      <button class="btn btn-primary" data-action="start-quiz" data-scope="${ch.id}">${tr('quizThisChapter')}</button>
      <button class="btn btn-outline" data-nav="study-list">${tr('backToChapters')}</button>
    </div>
  `;
}

function renderQuizList(){
  const scores = getBestScores();
  const totalQs = DATA.chapters.reduce((s,c)=>s+c.questions.length,0);
  const bestFinal = scores["final"];

  const chapterCards = DATA.chapters.map(ch=>{
    const best = scores[ch.id];
    return `
    <div class="quizcard">
      <div class="tile ${ch.tile.theme==='green'?'tile-green':'tile-yellow'}"><span class="num">${ch.tile.num}</span><span class="sym">${ch.tile.sym}</span></div>
      <div class="qinfo">
        <h4>${t(ch.title)}</h4>
        <p>${t(ch.blurb)}</p>
        <div class="qtags">
          <span class="pill">${ch.questions.length} ${tr('questionsWord')}</span>
          ${best?`<span class="pill yellow">${tr('bestLabel')}: ${best}%</span>`:""}
        </div>
      </div>
      <button class="btn btn-primary" data-action="start-quiz" data-scope="${ch.id}">${tr('startQuiz')}</button>
    </div>`;
  }).join("");

  return `
    <h2 class="section-title">${tr('quizzesHeading')}</h2>
    <div class="quizcard final">
      <div class="tile tile-green" style="background:linear-gradient(160deg,var(--yellow-400),var(--yellow-700));color:#2a1d00;"><span class="num">∞</span><span class="sym">Fx</span></div>
      <div class="qinfo">
        <h4>☣️ ${tr('finalExamTitle')}</h4>
        <p>${tr('finalExamDesc')}</p>
        <div class="qtags">
          <span class="pill yellow">${totalQs} ${tr('questionsWord')}</span>
          ${bestFinal?`<span class="pill yellow">${tr('bestLabel')}: ${bestFinal}%</span>`:""}
        </div>
      </div>
      <button class="btn btn-yellow" data-action="start-quiz" data-scope="final">${tr('startQuiz')}</button>
    </div>
    ${chapterCards}
  `;
}

function renderQuizActive(){
  const quiz = state.quiz;
  const total = quiz.questions.length;
  const idx = quiz.index;
  const q = quiz.questions[idx];
  const pct = Math.round((idx/total)*100);
  const ch = chapterById(q.chapterId);

  const optsHtml = q.options.map((opt,i)=>{
    let cls = "opt";
    if(quiz.answered){
      cls += " locked";
      if(i === q.correct) cls += " correct";
      else if(i === quiz.selected) cls += " wrong";
    }
    const letter = String.fromCharCode(65+i);
    return `<button class="${cls}" data-opt="${i}" ${quiz.answered?'disabled':''}>
      <span class="optletter">${letter}</span><span>${t(opt)}</span>
    </button>`;
  }).join("");

  let feedback = "";
  if(quiz.answered){
    const isCorrect = quiz.selected === q.correct;
    feedback = `<div class="feedback ${isCorrect?'good':'bad'}">
      <b>${isCorrect?tr('correctLabel'):tr('incorrectLabel')}</b>
      <div>${tr('explanationLabel')} ${t(q.exp)}</div>
    </div>`;
  }

  const isLast = idx === total-1;

  return `
    <div class="quiz-top">
      <span class="qcounter">${tr('question')} ${idx+1} ${tr('of')} ${total}</span>
      <div class="progressbar"><div style="width:${pct}%;"></div></div>
      <span class="scoretag">${quiz.correctCount}/${total}</span>
    </div>
    <div class="qcard">
      <span class="chaptag">${t(ch.title)}</span>
      <h3>${t(q.q)}</h3>
      <div class="options">${optsHtml}</div>
      ${feedback}
    </div>
    <div class="quiz-footer">
      ${quiz.answered ? `<button class="btn btn-primary" data-action="next-question">${isLast? tr('seeResults') : tr('next')}</button>` : ""}
    </div>
  `;
}

function renderQuizResult(){
  const quiz = state.quiz;
  const total = quiz.questions.length;
  const pct = Math.round((quiz.correctCount/total)*100);

  let grade = tr('gradeD');
  if(pct>=90) grade = tr('gradeA');
  else if(pct>=75) grade = tr('gradeB');
  else if(pct>=50) grade = tr('gradeC');

  const fillHeight = 120 * (pct/100);
  const fillY = 150 - fillHeight;

  let breakdownHtml = "";
  if(quiz.scopeId === "final"){
    const byChapter = {};
    quiz.questions.forEach((q,i)=>{
      byChapter[q.chapterId] = byChapter[q.chapterId] || {correct:0,total:0};
      byChapter[q.chapterId].total++;
      if(quiz.answers[i] === q.correct) byChapter[q.chapterId].correct++;
    });
    const rows = Object.keys(byChapter).map(cid=>{
      const ch = chapterById(cid);
      const d = byChapter[cid];
      const p = Math.round((d.correct/d.total)*100);
      return `<div class="bd-row">
        <span class="bd-label">${t(ch.title)}</span>
        <div class="bd-track"><div style="width:${p}%;"></div></div>
        <span class="bd-pct">${p}%</span>
      </div>`;
    }).join("");
    breakdownHtml = `<div class="breakdown"><h4>${tr('breakdownHeading')}</h4>${rows}</div>`;
  }

  return `
  <div class="result-wrap">
    <div class="flask">
      <svg viewBox="0 0 150 190">
        <defs>
          <clipPath id="flaskclip"><path d="M60 10 H90 V60 L128 165 Q133 178 118 178 H32 Q17 178 22 165 L60 60 Z"/></clipPath>
          <linearGradient id="liquid" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#3c6b1c"/>
            <stop offset="100%" stop-color="#9ccc3c"/>
          </linearGradient>
        </defs>
        <path d="M60 10 H90 V60 L128 165 Q133 178 118 178 H32 Q17 178 22 165 L60 60 Z" fill="none" stroke="var(--ink)" stroke-width="3"/>
        <g clip-path="url(#flaskclip)">
          <rect x="10" y="${fillY}" width="130" height="${fillHeight+40}" fill="url(#liquid)"/>
        </g>
        <line x1="52" y1="10" x2="98" y2="10" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <div class="pct">${pct}%</div>
    </div>
    <div class="result-grade">${grade}</div>
    <div class="result-sub">${t(quiz.scopeTitle)}</div>
    <div class="result-stats">
      <div class="result-stat"><b>${quiz.correctCount}/${total}</b><span>${tr('yourScore').toUpperCase()}</span></div>
      <div class="result-stat"><b>${pct}%</b><span>${tr('purityLabel').toUpperCase()}</span></div>
    </div>
    ${breakdownHtml}
    <div class="result-actions">
      <button class="btn btn-primary" data-action="retry-quiz">${tr('retryQuiz')}</button>
      <button class="btn btn-outline" data-nav="quiz-list">${tr('backToQuizzes')}</button>
      <button class="btn btn-outline" data-nav="home">${tr('backHome')}</button>
    </div>
  </div>`;
}

/* ============================= HANDLERS ============================= */
function attachHandlers(){
  appEl.querySelectorAll("[data-nav]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const view = el.getAttribute("data-nav");
      if(el.hasAttribute("data-chapter")) state.chapterId = el.getAttribute("data-chapter");
      state.view = view;
      window.scrollTo({top:0, behavior:"instant"});
      render();
    });
  });

  const langBtn = appEl.querySelector('[data-action="toggle-lang"]');
  if(langBtn) langBtn.addEventListener("click", ()=>{
    state.lang = state.lang === "en" ? "ar" : "en";
    saveLang();
    render();
  });

  appEl.querySelectorAll('[data-acc]').forEach(el=>{
    el.addEventListener("click", ()=>{
      const key = el.getAttribute("data-acc");
      state.openAcc[key] = !state.openAcc[key];
      render();
    });
  });

  appEl.querySelectorAll('[data-action="start-quiz"]').forEach(el=>{
    el.addEventListener("click", ()=>{
      const scopeId = el.getAttribute("data-scope");
      startQuiz(scopeId);
    });
  });

  appEl.querySelectorAll('[data-opt]').forEach(el=>{
    el.addEventListener("click", ()=>{
      if(state.quiz.answered) return;
      const i = parseInt(el.getAttribute("data-opt"),10);
      answerQuestion(i);
    });
  });

  const nextBtn = appEl.querySelector('[data-action="next-question"]');
  if(nextBtn) nextBtn.addEventListener("click", nextQuestion);

  const retryBtn = appEl.querySelector('[data-action="retry-quiz"]');
  if(retryBtn) retryBtn.addEventListener("click", ()=> startQuiz(state.quiz.scopeId));
}

function startQuiz(scopeId){
  let sourceQuestions, scopeTitle;
  if(scopeId === "final"){
    sourceQuestions = DATA.chapters.flatMap(c=>c.questions);
    scopeTitle = {en:"Final Exam", ar:"الاختبار الشامل"};
  }else{
    const ch = chapterById(scopeId);
    sourceQuestions = ch.questions;
    scopeTitle = ch.title;
  }
  state.quiz = {
    scopeId,
    scopeTitle,
    questions: buildQuizQuestions(sourceQuestions),
    index: 0,
    correctCount: 0,
    answers: [],
    answered: false,
    selected: null
  };
  state.view = "quiz-active";
  window.scrollTo({top:0, behavior:"instant"});
  render();
}

function answerQuestion(i){
  const quiz = state.quiz;
  quiz.selected = i;
  quiz.answered = true;
  quiz.answers[quiz.index] = i;
  if(i === quiz.questions[quiz.index].correct) quiz.correctCount++;
  render();
}

function nextQuestion(){
  const quiz = state.quiz;
  if(quiz.index < quiz.questions.length-1){
    quiz.index++;
    quiz.answered = false;
    quiz.selected = null;
    render();
  }else{
    const pct = Math.round((quiz.correctCount/quiz.questions.length)*100);
    setBestScore(quiz.scopeId, pct);
    state.view = "quiz-result";
    render();
  }
}

render();
</script>
</body>
</html>
